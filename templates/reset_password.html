<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — REC Bijnor Academic AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0e1117;
  --ink2: #1a2235;
  --saffron: #e8820c;
  --saffron-pale: #f5a93a;
  --saffron-glow: rgba(232,130,12,0.15);
  --teal: #0d9488;
  --cream: #f7f3ea;
  --muted: #7a8599;
  --border: rgba(232,130,12,0.18);
  --glass-bg: rgba(14,17,23,0.85);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Outfit',sans-serif;
  background:var(--ink);
  color:var(--cream);
  height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}

.auth-wrap{
  width:100%;max-width:460px;
  animation:riseIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes riseIn{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes spin{to{transform:rotate(360deg)}}

.auth-panel{
  background:var(--glass-bg);
  border:1px solid var(--border);
  border-radius:24px;
  padding:44px 42px 40px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04) inset,
    0 32px 80px rgba(0,0,0,0.5),
    0 0 60px rgba(232,130,12,0.05);
}

.logo-block{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:32px;gap:14px;
}
.logo-ring{position:relative;width:96px;height:96px;}
.logo-ring::before{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  background:conic-gradient(from 0deg, var(--saffron), var(--saffron-pale), var(--teal), var(--saffron));
  animation:spin 6s linear infinite;padding:3px;
}
.logo-ring::after{
  content:'';position:absolute;inset:0;border-radius:50%;background:var(--ink2);
}
.logo-img{
  position:absolute;inset:4px;border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;
  z-index:2;overflow:hidden;
}
.logo-img img{width:100%;height:100%;object-fit:contain;border-radius:50%;}
.college-name{text-align:center;}
.college-name h1{
  font-family:'Cormorant Garamond',serif;
  font-size:21px;font-weight:700;line-height:1.2;
  color:var(--cream);letter-spacing:0.3px;
}
.college-name .tagline{
  font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--saffron);font-weight:500;margin-top:5px;
  font-family:'Fira Code',monospace;
}

.panel-title{
  font-size:15px;font-weight:600;
  color:var(--cream);margin-bottom:6px;
}
.panel-sub{
  font-size:13px;color:var(--muted);
  margin-bottom:24px;line-height:1.6;
}

.field{margin-bottom:16px;}
.field label{
  display:block;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px;font-weight:500;
}
.field input{
  width:100%;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:10px;padding:12px 14px;
  color:var(--cream);font-family:'Outfit';font-size:14px;
  outline:none;transition:all 0.2s;
}
.field input:focus{
  border-color:var(--saffron);
  background:rgba(232,130,12,0.06);
  box-shadow:0 0 0 3px rgba(232,130,12,0.1);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:72px;
}

.toggle-eye{
  position:absolute;
  top:50%;
  right:10px;
  transform:translateY(-50%);
  border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.06);
  color:var(--cream);
  border-radius:7px;
  padding:4px 10px;
  font-size:11px;
  cursor:pointer;
}

.toggle-eye:hover{
  border-color:var(--saffron);
  color:var(--saffron);
}

.btn-submit{
  width:100%;
  background:linear-gradient(135deg,var(--saffron) 0%,var(--saffron-pale) 100%);
  border:none;border-radius:10px;
  padding:14px;margin-top:4px;
  font-family:'Outfit';font-size:14px;font-weight:600;
  color:#fff;cursor:pointer;letter-spacing:0.4px;
  transition:all 0.2s;position:relative;overflow:hidden;
}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(232,130,12,0.4);}
.btn-submit:active{transform:translateY(0);}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none;}

.err{
  color:#f87171;font-size:12px;
  margin-top:-10px;margin-bottom:12px;
  display:none;padding-left:2px;
}

.success-box{
  background:rgba(13,148,136,0.1);
  border:1px solid rgba(13,148,136,0.3);
  border-radius:10px;padding:16px;
  font-size:13px;color:#5eead4;
  display:none;line-height:1.6;
  margin-bottom:16px;
}

.back-link{
  text-align:center;margin-top:18px;
}
.back-link a{
  font-size:12px;color:var(--saffron);
  cursor:pointer;font-family:'Fira Code',monospace;
  text-decoration:none;
}
.back-link a:hover{opacity:0.75;}

/* password strength bar */
.strength-bar{
  height:3px;border-radius:2px;
  background:rgba(255,255,255,0.06);
  margin-top:8px;overflow:hidden;
}
.strength-fill{
  height:100%;width:0%;
  border-radius:2px;
  transition:width 0.3s, background 0.3s;
}
.strength-label{
  font-size:10px;color:var(--muted);
  margin-top:4px;text-align:right;
  font-family:'Fira Code',monospace;
}

/* expired/invalid state */
.invalid-box{
  background:rgba(248,113,113,0.08);
  border:1px solid rgba(248,113,113,0.25);
  border-radius:10px;padding:16px;
  font-size:13px;color:#f87171;
  line-height:1.6;text-align:center;
  display:none;
}

@media (max-width: 640px){
  html,body{
    height:auto;
    min-height:100%;
    overflow-x:hidden;
    overflow-y:auto;
  }

  body{
    min-height:100dvh;
    padding:12px;
  }

  .auth-wrap{
    max-width:100%;
  }

  .auth-panel{
    padding:28px 20px 24px;
    border-radius:20px;
  }

  .logo-ring{
    width:78px;
    height:78px;
  }

  .college-name h1{
    font-size:18px;
  }

  .college-name .tagline{
    letter-spacing:2px;
  }

  .panel-title{
    font-size:14px;
  }

  .panel-sub{
    font-size:12px;
  }

  .field input{
    font-size:16px;
  }

  .btn-submit{
    padding:13px;
  }
}

@media (max-width: 420px){
  .auth-panel{
    padding:24px 16px 22px;
  }

  .college-name h1{
    font-size:17px;
  }
}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-panel">

    <div class="logo-block">
      <div class="logo-ring">
        <div class="logo-img">
          <img src="/static/Images/logo.png" alt="REC Bijnor">
        </div>
      </div>
      <div class="college-name">
        <h1>Rajkiya Engineering College<br>Bijnor</h1>
        <div class="tagline">Academic AI</div>
      </div>
    </div>

    <!-- Invalid token state -->
    <div class="invalid-box" id="invalidBox">
      ✗ &nbsp;This reset link is <strong>invalid or has expired</strong>.<br><br>
      <a href="/" style="color:var(--saffron);font-family:monospace;font-size:12px;">← Request a new reset link</a>
    </div>

    <!-- Reset form -->
    <div id="resetForm">
      <div class="panel-title">Set New Password</div>
      <div class="panel-sub">Choose a strong password for your account.</div>

      <div class="field">
        <label>New Password</label>
        <div class="password-wrap">
          <input type="password" id="newPass" placeholder="Enter new password" oninput="checkStrength(this.value)">
          <button type="button" class="toggle-eye" onclick="togglePassword('newPass', this)">Show</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>

      <div class="field">
        <label>Confirm Password</label>
        <div class="password-wrap">
          <input type="password" id="confirmPass" placeholder="Re-enter new password" onkeydown="if(event.key==='Enter')doReset()">
          <button type="button" class="toggle-eye" onclick="togglePassword('confirmPass', this)">Show</button>
        </div>
      </div>

      <div class="err" id="resetErr">Passwords do not match.</div>

      <div class="success-box" id="resetSuccess">
        ✓ &nbsp;Password reset successfully! Redirecting to login...
      </div>

      <button class="btn-submit" id="resetBtn" onclick="doReset()">Reset Password →</button>

      <div class="back-link">
        <a href="/">← Back to Sign In</a>
      </div>
    </div>

  </div>
</div>

<script>
const API_BASE = window.location.origin;

function togglePassword(inputId, buttonEl) {
  const input = document.getElementById(inputId);
  if (!input || !buttonEl) return;
  const showing = input.type === "text";
  input.type = showing ? "password" : "text";
  buttonEl.textContent = showing ? "Show" : "Hide";
}

// Extract token from URL
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get("token");

// If no token in URL, show invalid box immediately
if (!token) {
  document.getElementById("invalidBox").style.display = "block";
  document.getElementById("resetForm").style.display = "none";
}

/* ── Password strength checker ── */
function checkStrength(val) {
  const fill = document.getElementById("strengthFill");
  const label = document.getElementById("strengthLabel");

  let score = 0;
  if (val.length >= 8)  score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;

  const levels = [
    { pct: "0%",   color: "transparent", text: "" },
    { pct: "25%",  color: "#f87171",     text: "Weak" },
    { pct: "50%",  color: "#fb923c",     text: "Fair" },
    { pct: "75%",  color: "#facc15",     text: "Good" },
    { pct: "100%", color: "#4ade80",     text: "Strong" },
  ];

  fill.style.width     = levels[score].pct;
  fill.style.background = levels[score].color;
  label.textContent    = levels[score].text;
  label.style.color    = levels[score].color;
}

/* ── Reset submit ── */
async function doReset() {
  const newPass     = document.getElementById("newPass").value;
  const confirmPass = document.getElementById("confirmPass").value;
  const errBox      = document.getElementById("resetErr");
  const successBox  = document.getElementById("resetSuccess");
  const btn         = document.getElementById("resetBtn");

  errBox.style.display     = "none";
  successBox.style.display = "none";

  if (!newPass || !confirmPass) {
    errBox.textContent = "Please fill in both fields.";
    errBox.style.display = "block";
    return;
  }

  if (newPass !== confirmPass) {
    errBox.textContent = "Passwords do not match.";
    errBox.style.display = "block";
    return;
  }

  if (newPass.length < 6) {
    errBox.textContent = "Password must be at least 6 characters.";
    errBox.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Resetting...";

  try {
    const res = await fetch(`${API_BASE}/auth/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, new_password: newPass })
    });

    const data = await res.json();

    if (!res.ok) {
      // Token expired or invalid
      if (res.status === 400) {
        document.getElementById("resetForm").style.display = "none";
        document.getElementById("invalidBox").style.display = "block";
        document.getElementById("invalidBox").innerHTML =
          `✗ &nbsp;${data.detail}<br><br><a href="/" style="color:var(--saffron);font-family:monospace;font-size:12px;">← Request a new reset link</a>`;
      } else {
        throw new Error(data.detail || "Reset failed.");
      }
      return;
    }

    // Success
    successBox.style.display = "block";
    btn.style.display = "none";
    setTimeout(() => { window.location.href = "/"; }, 2500);

  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Reset Password →";
  }
}
</script>
</body>
</html>
