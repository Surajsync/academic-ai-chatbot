<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC Bijnor — Academic AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --ink:#0e1117;
  --ink2:#1a2235;
  --sidebar:#0f172a;
  --saffron:#e8820c;
  --saffron-pale:#f5a93a;
  --cream:#f7f3ea;
  --muted:#7a8599;
  --border:rgba(232,130,12,0.18);
  --border-subtle:rgba(255,255,255,0.06);
  --msg-user:linear-gradient(135deg,#e8820c,#f5a93a);
  --msg-bot:rgba(26,34,53,0.9);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  background:var(--ink);
  font-family:'Outfit',sans-serif;
  color:var(--cream);
}

/* ━━━━━━━━━ LAYOUT ━━━━━━━━━ */
.app{
  height:100vh;
  display:flex;
}

/* ━━━━━━━━━ SIDEBAR ━━━━━━━━━ */
.sidebar{
  width:270px;
  background:var(--sidebar);
  border-right:1px solid var(--border-subtle);
  display:flex;
  flex-direction:column;
  padding:22px;
}

/* Profile */
.profile{
  display:flex;
  align-items:center;
  gap:12px;
  padding-bottom:20px;
  border-bottom:1px solid var(--border-subtle);
  margin-bottom:20px;
}

.profile-icon{
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--ink2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  border:1px solid var(--border-subtle);
}

.profile-text small{
  color:var(--muted);
  font-size:12px;
}

.profile-text h3{
  font-size:15px;
  margin-top:2px;
}

/* Buttons */
.new-chat{
  width:100%;
  padding:16px 0;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,var(--saffron),var(--saffron-pale));
  color:white;
  font-weight:600;
  font-size:15px;
  letter-spacing:0.3px;
  cursor:pointer;
  transition:all 0.25s ease;
  box-shadow:0 6px 20px rgba(232,130,12,0.25);
}

.new-chat:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(232,130,12,0.4);
}

.chat-input button{
  transition:all 0.25s ease;
}

.chat-input button:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(232,130,12,0.4);
}

.sidebar{
  width:270px;
  background:var(--sidebar);
  border-right:1px solid var(--border-subtle);
  display:flex;
  flex-direction:column;
  padding:22px;
  overflow:hidden; /* prevent full-page stretch */
}

/* bottom block */
.sidebar-bottom{
  flex:1;                 /* take remaining height */
  display:flex;
  flex-direction:column;
  padding-top:20px;
  border-top:1px solid var(--border-subtle);
  overflow:hidden;        /* important */
}

.section-title{
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:6px;
}

.logout{
  margin-top:18px;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border-subtle);
  background:none;
  color:var(--cream);
  cursor:pointer;
  transition:0.2s;
}
.logout:hover{
  background:rgba(232,130,12,0.12);
}

.item{
  padding:8px 6px;
  font-size:14px;
  cursor:pointer;
  border-radius:6px;
}

.item:hover{
  background:rgba(232,130,12,0.12);
}

.logout{
  margin-top:auto;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border-subtle);
  background:none;
  color:var(--cream);
  cursor:pointer;
}

/* ━━━━━━━━━ MAIN ━━━━━━━━━ */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:20px 30px 20px 10px; 
  min-height:0;
}
/* Header */
.header{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:0px;
}

/* Logo ring (same as auth page) */
.logo-ring{
  position:relative;
  width:90px;
  height:90px;
}
.logo-ring::before{
  content:'';
  position:absolute;
  inset:0px;
  border-radius:50%;
  border:3px solid var(--saffron);
}
.logo-ring::after{
  content:'';
  position:absolute;
  inset:3px;
  border-radius:50%;
  background:var(--ink2);
}
.logo-img{
  position:absolute;
  inset:6px;
  border-radius:50%;
  overflow:hidden;
  z-index:2;
}
.logo-img img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:white;
}

.header-text h1{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
  font-weight:700;
}

.sub-title{
  font-weight: 400;
  color:var(--saffron);
  margin-top:4px;
}

.header-text p{
  font-size:18px;
  color:var(--saffron);
  margin-top:4px;
}

/* Chat Area */
.chat-box{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:40px 20px; /* increase top padding */
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  gap:14px;
  margin-bottom:20px;
  position:relative;
}

.chat-box::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:80px;
  pointer-events:none;
  z-index:5;

  background:linear-gradient(
    to bottom,
    rgba(14,17,23,1) 0%,
    rgba(14,17,23,0.85) 40%,
    rgba(14,17,23,0) 100%
  );
}

/* Styled scrollbar for webkit browsers */
.chat-box::-webkit-scrollbar{
  width:8px;
}

.chat-box::-webkit-scrollbar-track{
  background:rgba(255,255,255,0.04);
}

.chat-box::-webkit-scrollbar-thumb{
  background:rgba(232,130,12,0.4);
  border-radius:4px;
  transition:all 0.2s ease;
}

.chat-box::-webkit-scrollbar-thumb:hover{
  background:rgba(232,130,12,0.7);
}

.message{
  max-width:65%;
  padding:12px 16px;
  border-radius:14px;
  font-size:14px;
  border:1px solid var(--border-subtle);
  line-height:1.5;
  word-wrap:break-word;
  white-space:pre-wrap;
  
  opacity:0;
  transform:translateY(10px) scale(0.98);
  animation:smoothAppear 0.35s ease forwards;
}

@keyframes smoothAppear{
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.bot{
  background:var(--msg-bot);
  align-self:flex-start;
}

.user{
  background:var(--msg-user);
  align-self:flex-end;
  color:white;
}

/* Input */
.chat-input{
  display:flex;
  gap:12px;
}

.chat-input input{
  flex:1;
  height:50px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--ink2);
  padding:0 16px;
  color:white;
}

.chat-input button{
  width:120px;
  border-radius:12px;
  border:none;
  background:linear-gradient(135deg,var(--saffron),var(--saffron-pale));
  color:white;
  font-weight:500;
  cursor:pointer;
}
/* ━━━━━━━━━ CONVERSATION ITEM━━━━━━━━━ */
.conversation-item{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 8px;
  border-radius:6px;
  cursor:pointer;
}

.conversation-item:hover{
  background:rgba(232,130,12,0.12);
}

.menu-btn{
  opacity:0;
  cursor:pointer;
  padding:4px 6px;
  border-radius:4px;
}

.conversation-item:hover .menu-btn{
  opacity:1;
}

#conversation-list{
  flex:1;
  overflow-y:auto;
  margin-top:10px;
  padding-right:4px;
}

/* Optional: clean scrollbar styling */
#conversation-list::-webkit-scrollbar{
  width:6px;
}

#conversation-list::-webkit-scrollbar-thumb{
  background:rgba(232,130,12,0.4);
  border-radius:6px;
}

.dropdown{
  position:absolute;
  right:5px;
  top:28px;
  background:#1a2235;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:8px;
  padding:6px 0;
  display:none;
  flex-direction:column;
  z-index:100;
  min-width:140px;
}

.dropdown div{
  padding:8px 12px;
  font-size:13px;
  cursor:pointer;
}

.dropdown div:hover{
  background:rgba(232,130,12,0.15);
}

.hero-welcome {
  margin:auto;
  max-width:720px;
  text-align:center;
  font-size:28px;
  font-weight:600;
  line-height:1.6;
  padding:50px 40px;
  border-radius:20px;
  color:var(--cream);

  background:linear-gradient(
      135deg,
      rgba(232,130,12,0.15),
      rgba(255,255,255,0.03)
  );

  border:1px solid var(--border);
  box-shadow:0 10px 40px rgba(0,0,0,0.4);

  animation:fadeInHero 0.5s ease forwards;
}

@keyframes fadeInHero {
  from {
      opacity:0;
      transform:translateY(20px);
  }
  to {
      opacity:1;
      transform:translateY(0);
  }
}


</style>
</head>
<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">

  <!-- TOP -->
  <div>
    <div class="profile">
      <div class="profile-icon">👤</div>
      <div class="profile-text">
        <small id="greet-text">Good Evening</small>
        <h3 id="sidebar-username">User</h3>
      </div>
    </div>

    <button class="new-chat">+ New Chat</button>
  </div>

  <!-- BOTTOM AREA -->
  <div class="sidebar-bottom">
    <div id="conversation-list"></div>
    <button class="logout">Logout</button>
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <div class="header">
    <div class="logo-ring">
      <div class="logo-img">
        <img src="/static/Images/logo.png" alt="REC Bijnor" onerror="handleLogoError(this)">
      </div>
    </div>

    <div class="header-text">
      <h1>Rajkiya Engineering College, Bijnor</h1>
      <p class="sub-title">Academic AI</p>
    </div>
  </div>

  <div class="chat-box" id="chat-box"></div>

  <div class="chat-input">
    <input type="text" id="user-input" placeholder="Type your message...">
    <button id="send-btn">Send</button>
  </div>

</div>
</div>

<script>

// ================= USERNAME + GREETING =================
const username = localStorage.getItem("username");
if (username) {
    document.getElementById("sidebar-username").innerText = username;

    const hour = new Date().getHours();
    let greet = "Good Evening";
    if (hour < 12) greet = "Good Morning";
    else if (hour < 17) greet = "Good Afternoon";

    document.getElementById("greet-text").innerText = greet;
}

// ================= AUTH CHECK =================
const tokenCheck = localStorage.getItem("access_token");
if (!tokenCheck) {
    window.location.href = "/auth_ui.html";
}

const roleCheck = (localStorage.getItem("role") || "").trim().toLowerCase();
if (roleCheck === "admin") {
  window.location.href = "/admin_ui.html";
}

// ================= DOM REFERENCES =================
const chatBox = document.getElementById("chat-box");
const input = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const conversationList = document.getElementById("conversation-list");
const API_BASE = window.location.origin;

async function enforceChatAccess() {
  const token = localStorage.getItem("access_token");
  if (!token) {
    window.location.href = "/auth_ui.html";
    return;
  }

  try {
    const meRes = await fetch(`${API_BASE}/auth/me`, {
      headers: { "Authorization": `Bearer ${token}` }
    });

    if (!meRes.ok) {
      localStorage.removeItem("access_token");
      localStorage.removeItem("role");
      window.location.href = "/auth_ui.html";
      return;
    }

    const me = await meRes.json();
    const role = (me.role || "").toString().trim().toLowerCase();
    localStorage.setItem("role", role || "user");
    if (role === "admin") {
      window.location.href = "/admin_ui.html";
    }
  } catch {
    // If role verification fails due transient network errors, keep current page.
  }
}

enforceChatAccess();

// ================= LOAD CONVERSATIONS FROM BACKEND =================
async function loadConversationsFromBackend() {
    try {
        const token = localStorage.getItem("access_token");
        const response = await fetch(`${API_BASE}/chat/history`, {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            const conversations = await response.json();
            // Convert backend format to frontend format
            const formattedConvs = conversations.map(conv => ({
              id: normalizeConversationId(conv.id),
                title: conv.title,
                messages: conv.messages.map(msg => ({
                    role: msg.role,
                text: msg.text || msg.content || ""
                })),
                pinned: false,
                archived: false
            }));
            
            // Update state with conversations from backend
            state.conversations = formattedConvs;
            localStorage.setItem("conversations", JSON.stringify(state.conversations));
            renderConversations();
        }
    } catch (error) {
        console.error("Error loading conversations:", error);
    }
}

// ================= WELCOME PROMPTS =================
const welcomePrompts = [
    "Welcome! 🌍 Which country currently holds the presidency of the G20?",
    "Hello! 🌎 Which country has the largest population today?",
    "Good day! 📚 How many continents are there on Earth?",
    "Hi there! 🌐 What major global event happened this week?",
    "Welcome! 🚀 Do you follow space or science updates regularly?",
    "🌍 India is now one of the fastest-growing major economies in the world, with rapid expansion in digital infrastructure.",    
    "🚀 The global tech industry is expected to cross $5 trillion in market value — skills in AI, cloud, and data are in high demand.",    
    "📚 Studies show that continuous upskilling improves career growth opportunities by over 30% in competitive industries.",    
    "🌐 More than 60% of global businesses are undergoing digital transformation today.",    
    "🛰️ Space technology is no longer limited to governments — private companies are leading new innovation.",
    "💼 Employers today value problem-solving and adaptability more than memorization-based learning.",
    "📊 Data-driven decision making is becoming standard practice across industries worldwide.",    
    "🌎 Renewable energy and sustainability sectors are creating millions of new jobs globally.",    
    "🧠 Lifelong learning is considered one of the strongest predictors of long-term career success.",    
    "🔐 Cybersecurity spending worldwide continues to increase due to growing digital threats."
];

// ================= APP STATE =================
const state = {
    conversations: JSON.parse(localStorage.getItem("conversations")) || [],
    currentConversationId: localStorage.getItem("currentConversationId"),
    archivedExpanded: false
};

function normalizeConversationId(id) {
  if (id === null || id === undefined) return null;
  return String(id);
}

function isTemporaryConversationId(id) {
  return normalizeConversationId(id)?.startsWith("tmp-");
}

function findConversation(id) {
  const targetId = normalizeConversationId(id);
  return state.conversations.find(c => normalizeConversationId(c.id) === targetId);
}

state.conversations = state.conversations.map(conv => ({
  ...conv,
  id: normalizeConversationId(conv.id),
  messages: (conv.messages || []).map(msg => ({
    role: msg.role,
    text: msg.text || msg.content || ""
  }))
}));
state.currentConversationId = normalizeConversationId(state.currentConversationId);

function updateState(newState = {}) {
    Object.assign(state, newState);
  state.conversations = state.conversations.map(conv => ({
    ...conv,
    id: normalizeConversationId(conv.id),
    messages: (conv.messages || []).map(msg => ({
      role: msg.role,
      text: msg.text || msg.content || ""
    }))
  }));
  state.currentConversationId = normalizeConversationId(state.currentConversationId);
    localStorage.setItem("conversations", JSON.stringify(state.conversations));
    localStorage.setItem("currentConversationId", state.currentConversationId);
    renderConversations();
}

// ================= SAMPLE STARTER PROMPTS =================
const academicStarters = [
    "What is the syllabus for Data Structures?",
    "How many faculties are in CSE department?",
    "What is the GATE 2026 exam pattern?",
    "Explain OSI model in simple terms.",
    "What are the placement statistics of REC Bijnor?",
    "How to prepare for internships in 3rd year?",
    "Difference between TCP and UDP?",
    "Explain normalization in DBMS."
];

// ================= CREATE NEW CHAT =================
function createNewConversation() {

    // Remove previous empty conversation if exists
    if (state.currentConversationId) {
        const existing = state.conversations.find(
            c => c.id === state.currentConversationId
        );

        if (existing && existing.messages.length === 0) {
            state.conversations = state.conversations.filter(
                c => c.id !== existing.id
            );
        }
    }

    const id = `tmp-${Date.now()}`;

    const newConv = {
        id,
        title: "New Chat",
        messages: [],
        pinned: false,
        archived: false
    };

    updateState({
        conversations: [newConv, ...state.conversations],
        currentConversationId: id
    });

    loadConversation(id);
}

// ================= WELCOME PROMPT =================
function showWelcomePrompt() {
    chatBox.innerHTML = "";

    const randomPrompt =
        welcomePrompts[Math.floor(Math.random() * welcomePrompts.length)];

    const hero = document.createElement("div");
    hero.className = "hero-welcome";
    hero.innerText = randomPrompt;

    chatBox.appendChild(hero);
}

// ================= CREATE CONVERSATION ITEM =================
function createConversationItem(conv) {
  const convId = normalizeConversationId(conv.id);

    const wrapper = document.createElement("div");
    wrapper.className = "conversation-item";
  wrapper.onclick = () => {
    updateState({ currentConversationId: convId });
    loadConversation(convId);
  };

    const title = document.createElement("span");
    title.textContent = conv.pinned ? "📌 " + conv.title : conv.title;

    const menuBtn = document.createElement("span");
    menuBtn.className = "menu-btn";
    menuBtn.textContent = "⋮";

    const dropdown = document.createElement("div");
    dropdown.className = "dropdown";

    dropdown.innerHTML = `
      <div data-action="share" data-id="${convId}">Share</div>
      <div data-action="rename" data-id="${convId}">Rename</div>
      <div data-action="toggle-pin" data-id="${convId}">
            ${conv.pinned ? "Unpin" : "Pin"}
        </div>
        ${
            conv.archived
          ? `<div data-action="restore" data-id="${convId}">Restore</div>`
          : `<div data-action="archive" data-id="${convId}">Archive</div>`
        }
      <div data-action="delete" data-id="${convId}">Delete</div>
    `;

    menuBtn.onclick = (e) => {
        e.stopPropagation();
        closeDropdowns();
        dropdown.style.display = "flex";
    };

    wrapper.appendChild(title);
    wrapper.appendChild(menuBtn);
    wrapper.appendChild(dropdown);
    conversationList.appendChild(wrapper);
}

// ================= RENDER SIDEBAR =================
function renderConversations() {

    conversationList.innerHTML = "";

    const pastConversations = state.conversations
        .filter(c => !c.archived)
        .sort((a, b) => {
            if (a.pinned === b.pinned) return 0;
            return a.pinned ? -1 : 1;
        });

    const archived = state.conversations.filter(c => c.archived);

    // Past Conversations
    if (pastConversations.length > 0) {
        const sectionTitle = document.createElement("div");
        sectionTitle.className = "section-title";
        sectionTitle.innerText = "Past Conversations";
        conversationList.appendChild(sectionTitle);

        pastConversations.forEach(conv => {
            createConversationItem(conv);
        });
    }

    // Archived (Collapsible)
    if (archived.length > 0) {

        const archivedHeader = document.createElement("div");
        archivedHeader.className = "section-title";
        archivedHeader.style.marginTop = "25px";
        archivedHeader.style.cursor = "pointer";
        archivedHeader.innerText =
            (state.archivedExpanded ? "▼ " : "▶ ") +
            `Archived (${archived.length})`;

        archivedHeader.onclick = () => {
            state.archivedExpanded = !state.archivedExpanded;
            renderConversations();
        };

        conversationList.appendChild(archivedHeader);

        if (state.archivedExpanded) {
            archived.forEach(conv => {
                createConversationItem(conv);
            });
        }
    }
}

// ================= LOAD CHAT =================
function loadConversation(id) {

  const conv = findConversation(id);
    if (!conv) return;

    chatBox.innerHTML = "";

    conv.messages.forEach(msg => {
        const bubble = document.createElement("div");
        bubble.className = "message " + msg.role;
      const safeText = msg.text || msg.content || "";
        
        // For bot messages, use innerHTML to support formatted text
        if (msg.role === "bot") {
        bubble.innerHTML = safeText
          .replace(/\n/g, '<br>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/__(.*?)__/g, '<em>$1</em>');
        } else {
        bubble.textContent = safeText;
        }
        
        chatBox.appendChild(bubble);
    });

    chatBox.scrollTop = chatBox.scrollHeight;
}

// ================= SAVE MESSAGE =================
function saveMessage(role, text) {

  const conv = findConversation(state.currentConversationId);

    if (!conv) return;

    conv.messages.push({ role, text });

    if (conv.title === "New Chat") {
        conv.title = text.substring(0, 25);
    }

    updateState();
}

// ================= SEND MESSAGE =================
async function sendMessage() {

    const msg = input.value.trim();
    if (!msg) return;

    if (chatBox.querySelector(".hero-welcome")) {
        chatBox.innerHTML = "";
    }

    if (!state.currentConversationId) {
        createNewConversation();
    }

    const userBubble = document.createElement("div");
    userBubble.className = "message user";
    userBubble.textContent = msg;
    chatBox.appendChild(userBubble);

    saveMessage("user", msg);

    input.value = "";
    chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: "smooth" });

    const token = localStorage.getItem("access_token");
    if (!token) {
        alert("Session expired. Please login again.");
        window.location.href = "/auth_ui.html";
        return;
    }

    try {
      const activeConversationId = normalizeConversationId(state.currentConversationId);
      const conversationIdForApi = activeConversationId && !isTemporaryConversationId(activeConversationId)
        ? Number(activeConversationId)
        : null;

        const response = await fetch(`${API_BASE}/chat`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
        body: JSON.stringify({
          message: msg,
          conversation_id: conversationIdForApi
        })
        });

        if (!response.ok) return;

        const data = await response.json();

      if (data.conversation_id) {
        const serverConversationId = normalizeConversationId(data.conversation_id);

        if (activeConversationId && isTemporaryConversationId(activeConversationId)) {
          const localConversation = findConversation(activeConversationId);
          if (localConversation) {
            localConversation.id = serverConversationId;
          }
          state.currentConversationId = serverConversationId;
          updateState();
        } else if (serverConversationId && state.currentConversationId !== serverConversationId) {
          state.currentConversationId = serverConversationId;
          updateState();
        }
      }

        const botBubble = document.createElement("div");
        botBubble.className = "message bot";
        
        // Display formatted text with proper line breaks
        botBubble.innerHTML = data.reply
            .replace(/\n/g, '<br>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/__(.*?)__/g, '<em>$1</em>');
        
        chatBox.appendChild(botBubble);

        saveMessage("bot", data.reply);

        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: "smooth" });

    } catch (error) {
        console.error("Fetch error:", error);
    }
}

// ================= CONVERSATION ACTIONS =================
function shareConversation(id) {
  const conv = findConversation(id);
    if (!conv) return;

    const text = conv.messages
        .map(m => `${m.role.toUpperCase()}: ${m.text}`)
        .join("\n");

    navigator.clipboard.writeText(text);
    alert("Conversation copied to clipboard");
}

function renameConversation(id) {
  const conv = findConversation(id);
    if (!conv) return;

    const newTitle = prompt("Enter new name:", conv.title);
    if (!newTitle) return;

    conv.title = newTitle.trim();
    updateState();
}

function togglePin(id) {
  const conv = findConversation(id);
    if (!conv) return;

    conv.pinned = !conv.pinned;
    updateState();
}

function archiveConversation(id) {
  const conv = findConversation(id);
    if (!conv) return;

    conv.archived = true;
    conv.pinned = false;

    const wasCurrent = normalizeConversationId(state.currentConversationId) === normalizeConversationId(id);
    updateState();

    if (wasCurrent) {
        const next = state.conversations.find(c => !c.archived);
        if (next) {
            updateState({ currentConversationId: next.id });
            loadConversation(next.id);
        } else {
            state.currentConversationId = null;
            createNewConversation();
            showWelcomePrompt();
        }
    }
}

function restoreConversation(id) {
  const conv = findConversation(id);
    if (!conv) return;

    conv.archived = false;
    updateState();
}

function deleteConversation(id) {
    const confirmDelete = confirm("Are you sure you want to delete this chat?");
    if (!confirmDelete) return;

    const targetId = normalizeConversationId(id);
    const filtered = state.conversations.filter(c => normalizeConversationId(c.id) !== targetId);

    updateState({
        conversations: filtered,
        currentConversationId:
        normalizeConversationId(state.currentConversationId) === targetId ? null : state.currentConversationId
    });

    if (!state.currentConversationId) {
        createNewConversation();
    }
}

function closeDropdowns() {
    document.querySelectorAll(".dropdown")
        .forEach(d => d.style.display = "none");
}

document.addEventListener("click", closeDropdowns);

conversationList.addEventListener("click", function (e) {

    const action = e.target.dataset.action;
    const id = e.target.dataset.id;

    if (!action || !id) return;

    switch (action) {
        case "share": shareConversation(id); break;
        case "rename": renameConversation(id); break;
        case "toggle-pin": togglePin(id); break;
        case "archive": archiveConversation(id); break;
        case "restore": restoreConversation(id); break;
        case "delete": deleteConversation(id); break;
    }

    closeDropdowns();
});

// ================= EVENTS =================
sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
});

document.querySelector(".new-chat")
    .addEventListener("click", () => {
        createNewConversation();
        showWelcomePrompt();
    });

document.querySelector(".logout").addEventListener("click", () => {
    localStorage.removeItem("access_token");
    localStorage.removeItem("currentConversationId");
    window.location.href = "/auth_ui.html";
});

// ================= INITIAL LOAD =================
// Load conversations from backend first
loadConversationsFromBackend().then(() => {
  if (!state.currentConversationId || !findConversation(state.currentConversationId)) {
        createNewConversation();
        showWelcomePrompt();
    } else {
        renderConversations();
        loadConversation(state.currentConversationId);
    }
});

function handleLogoError(img){
  const candidates = ["/static/Images/logo.png", "/logo.png", "static/Images/logo.png", "../static/Images/logo.png"];
  const current = img.getAttribute("src") || "";
  const idx = candidates.indexOf(current);
  const next = idx >= 0 ? candidates[idx + 1] : candidates[0];
  if (next) img.src = next;
}
