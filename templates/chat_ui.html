<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC Bijnor — Academic AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --ink:#0e1117;
  --ink2:#1a2235;
  --sidebar:#0f172a;
  --saffron:#e8820c;
  --saffron-pale:#f5a93a;
  --cream:#f7f3ea;
  --muted:#7a8599;
  --border:rgba(232,130,12,0.18);
  --border-subtle:rgba(255,255,255,0.06);
  --msg-user:linear-gradient(135deg,#e8820c,#f5a93a);
  --msg-bot:rgba(26,34,53,0.9);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  background:var(--ink);
  font-family:'Outfit',sans-serif;
  color:var(--cream);
}

/* ━━━━━━━━━ LAYOUT ━━━━━━━━━ */
.app{
  height:100vh;
  display:flex;
}

/* ━━━━━━━━━ SIDEBAR ━━━━━━━━━ */
.sidebar{
  width:270px;
  background:var(--sidebar);
  border-right:1px solid var(--border-subtle);
  display:flex;
  flex-direction:column;
  padding:22px;
}

/* Profile */
.profile{
  display:flex;
  align-items:center;
  gap:12px;
  padding-bottom:20px;
  border-bottom:1px solid var(--border-subtle);
  margin-bottom:20px;
}

.profile-icon{
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--ink2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  border:1px solid var(--border-subtle);
}

.profile-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.profile-text small{
  color:var(--muted);
  font-size:12px;
}

.profile-text h3{
  font-size:15px;
  margin-top:2px;
}

.profile-card{
  margin-top:14px;
  padding:14px;
  border-radius:16px;
  border:1px solid var(--border-subtle);
  background:linear-gradient(180deg,rgba(26,34,53,0.92),rgba(14,17,23,0.75));
  box-shadow:0 12px 30px rgba(0,0,0,0.24);
}

.profile-card-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.profile-avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  overflow:hidden;
  border:1px solid rgba(232,130,12,0.35);
  background:rgba(232,130,12,0.12);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-card-name{
  font-size:14px;
  font-weight:600;
  color:var(--cream);
}

.profile-card-sub{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
  margin-top:2px;
}

.profile-card-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.profile-card button,
.header-actions button{
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

.profile-edit-btn,
.chat-delete-btn{
  padding:10px 12px;
  background:rgba(232,130,12,0.14);
  color:var(--cream);
  border:1px solid rgba(232,130,12,0.2);
}

.chat-delete-btn{
  background:rgba(244,63,94,0.12);
  border-color:rgba(244,63,94,0.22);
}

.profile-edit-btn:hover,
.chat-delete-btn:hover{
  transform:translateY(-1px);
}

.header-actions{
  margin-left:auto;
  display:flex;
  gap:10px;
  align-items:center;
}

.header-actions button{
  padding:10px 14px;
  font-size:13px;
}


.header-menu-wrap{
  position:relative;
  margin-left:auto;
  align-self:flex-start;
}

.header-menu-btn{
  width:44px;
  height:44px;
  border-radius:12px;
  border:1px solid var(--border-subtle);
  background:rgba(255,255,255,0.06);
  color:var(--cream);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:22px;
  line-height:1;
}

.header-menu-btn:hover{
  background:rgba(232,130,12,0.14);
}

.header-menu-dropdown{
  position:absolute;
  right:0;
  top:52px;
  width:min(320px, calc(100vw - 30px));
  background:rgba(15,23,42,0.98);
  border:1px solid var(--border-subtle);
  border-radius:14px;
  box-shadow:0 18px 40px rgba(0,0,0,0.42);
  display:none;
  flex-direction:column;
  overflow:hidden;
  z-index:260;
}

.header-menu-dropdown.open{
  display:flex;
}

.header-menu-section{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}

.header-menu-section:last-child{
  border-bottom:none;
}

.header-menu-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.9px;
  color:var(--muted);
  margin-bottom:10px;
}

.language-group{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.language-btn{
  border:1px solid var(--border-subtle);
  background:rgba(255,255,255,0.04);
  color:var(--cream);
  border-radius:10px;
  padding:7px 11px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}

.language-btn.active{
  background:rgba(232,130,12,0.2);
  border-color:rgba(232,130,12,0.4);
}


.assistant-tools{
  margin:10px 0 14px;
  padding:12px;
  border:1px solid var(--border-subtle);
  border-radius:14px;
  background:linear-gradient(180deg,rgba(22,30,45,0.75),rgba(14,17,23,0.72));
  display:flex;
  flex-direction:column;
  gap:10px;
}

.tool-search-wrap{
  display:flex;
  align-items:center;
  gap:8px;
}

.tool-clear-btn,
.tool-action-btn,
.tool-role-btn{
  border:1px solid var(--border-subtle);
  background:rgba(255,255,255,0.04);
  color:var(--cream);
  border-radius:10px;
  padding:8px 11px;
  font-size:12px;
  font-weight:500;
  cursor:pointer;
}

.tool-clear-btn:hover,
.tool-action-btn:hover,
.tool-role-btn:hover{
  background:rgba(232,130,12,0.12);
  border-color:rgba(232,130,12,0.24);
}

.tool-role-btn.active{
  background:rgba(232,130,12,0.24);
  border-color:rgba(232,130,12,0.42);
}

.tool-grid{
  display:flex;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}

.tool-group{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.tool-group.compact{
  justify-content:space-between;
}

.tool-action-btn.danger{
  color:#fda4af;
}

.search-summary{
  color:var(--muted);
  font-size:12px;
}


.chat-toolbar{
  display:flex;
  gap:12px;
  align-items:center;
  margin:10px 0 14px;
}

.tool-search{
  flex:1;
  min-width:240px;
  background:var(--ink2);
  border:1px solid var(--border-subtle);
  color:var(--cream);
  border-radius:10px;
  height:40px;
  padding:0 12px;
}

.chat-menu-wrap{
  position:relative;
}

.chat-options-btn{
  border:none;
  border-radius:12px;
  height:40px;
  min-width:44px;
  padding:0 12px;
  cursor:pointer;
  color:var(--cream);
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border-subtle);
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  letter-spacing:0.4px;
}

.chat-options-btn:hover{
  background:rgba(232,130,12,0.14);
}

.selected-chip{
  padding:2px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
  color:#fff;
  background:rgba(232,130,12,0.9);
}

.is-hidden{
  display:none !important;
}

.chat-options-dropdown{
  position:absolute;
  right:0;
  top:48px;
  width:230px;
  background:rgba(15,23,42,0.98);
  border:1px solid var(--border-subtle);
  border-radius:12px;
  box-shadow:0 18px 40px rgba(0,0,0,0.42);
  display:none;
  flex-direction:column;
  overflow:hidden;
  z-index:250;
}

.chat-options-dropdown.open{
  display:flex;
}

.chat-option-item{
  border:none;
  background:transparent;
  color:var(--cream);
  text-align:left;
  padding:11px 12px;
  font-size:13px;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.chat-option-item:last-child{
  border-bottom:none;
}

.chat-option-item:hover{
  background:rgba(232,130,12,0.12);
}

.chat-option-item.danger{
  color:#fda4af;
}

.message-context-menu{
  position:fixed;
  min-width:190px;
  background:rgba(15,23,42,0.98);
  border:1px solid var(--border-subtle);
  border-radius:10px;
  box-shadow:0 16px 36px rgba(0,0,0,0.45);
  display:none;
  z-index:400;
  overflow:hidden;
}

.message-context-menu.open{
  display:flex;
  flex-direction:column;
}

.message-context-item{
  border:none;
  background:transparent;
  color:var(--cream);
  text-align:left;
  padding:10px 12px;
  font-size:13px;
  cursor:pointer;
}

.message-context-item:hover{
  background:rgba(232,130,12,0.12);
}

.message-context-item.danger{
  color:#fda4af;
}

.delete-preview-list{
  margin:14px 0;
  max-height:220px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.delete-preview-item{
  border:1px solid var(--border-subtle);
  background:rgba(26,34,53,0.6);
  border-radius:10px;
  padding:10px 12px;
}

.delete-preview-role{
  font-size:11px;
  color:var(--saffron-pale);
  text-transform:uppercase;
  letter-spacing:0.7px;
  margin-bottom:6px;
}

.delete-preview-text{
  font-size:13px;
  color:var(--cream);
  line-height:1.45;
}

.header-actions .profile-edit-btn{
  background:linear-gradient(135deg,rgba(232,130,12,0.94),rgba(245,169,58,0.94));
  color:#fff;
}

.profile-modal{
  width:min(760px,92vw);
  background:rgba(14,17,23,0.98);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
  box-shadow:0 30px 90px rgba(0,0,0,0.55);
}

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(3,7,18,0.72);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1200;
}

.profile-modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.profile-modal-header h2{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
}

.profile-form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.profile-form-grid .full-span{
  grid-column:1 / -1;
}

.profile-upload{
  display:flex;
  align-items:center;
  gap:14px;
}

.profile-preview{
  width:84px;
  height:84px;
  border-radius:50%;
  overflow:hidden;
  border:1px solid rgba(232,130,12,0.25);
  background:rgba(255,255,255,0.05);
  flex-shrink:0;
}

.profile-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-help{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.profile-form-grid input,
.profile-form-grid textarea{
  width:100%;
  background:var(--ink2);
  color:var(--cream);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  outline:none;
}

.profile-form-grid textarea{
  min-height:100px;
  resize:vertical;
}

.profile-form-grid input:focus,
.profile-form-grid textarea:focus{
  border-color:rgba(245,169,58,0.8);
  box-shadow:0 0 0 3px rgba(232,130,12,0.1);
}

.profile-modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:18px;
}

.profile-modal-footer button{
  padding:11px 16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

.profile-modal-save{
  background:linear-gradient(135deg,var(--saffron),var(--saffron-pale));
  color:#fff;
}

.profile-modal-cancel{
  background:rgba(255,255,255,0.06);
  color:var(--cream);
}

/* Buttons */
.new-chat{
  width:100%;
  padding:16px 0;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,var(--saffron),var(--saffron-pale));
  color:white;
  font-weight:600;
  font-size:15px;
  letter-spacing:0.3px;
  cursor:pointer;
  transition:all 0.25s ease;
  box-shadow:0 6px 20px rgba(232,130,12,0.25);
}

.new-chat:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(232,130,12,0.4);
}

.chat-input button{
  transition:all 0.25s ease;
}

.chat-input button:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(232,130,12,0.4);
}

.sidebar{
  width:270px;
  background:var(--sidebar);
  border-right:1px solid var(--border-subtle);
  display:flex;
  flex-direction:column;
  padding:22px;
  overflow:hidden; /* prevent full-page stretch */
}

/* bottom block */
.sidebar-bottom{
  flex:1;                 /* take remaining height */
  display:flex;
  flex-direction:column;
  padding-top:20px;
  border-top:1px solid var(--border-subtle);
  overflow:hidden;        /* important */
}

.section-title{
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:6px;
}

.logout{
  margin-top:18px;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border-subtle);
  background:none;
  color:var(--cream);
  cursor:pointer;
  transition:0.2s;
}
.logout:hover{
  background:rgba(232,130,12,0.12);
}

.item{
  padding:8px 6px;
  font-size:14px;
  cursor:pointer;
  border-radius:6px;
}

.item:hover{
  background:rgba(232,130,12,0.12);
}

.logout{
  margin-top:auto;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border-subtle);
  background:none;
  color:var(--cream);
  cursor:pointer;
}

/* ━━━━━━━━━ MAIN ━━━━━━━━━ */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:20px 30px 20px 10px; 
  min-height:0;
}
/* Header */
.header{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:0px;
}

/* Logo ring (same as auth page) */
.logo-ring{
  position:relative;
  width:90px;
  height:90px;
}
.logo-ring::before{
  content:'';
  position:absolute;
  inset:0px;
  border-radius:50%;
  border:3px solid var(--saffron);
}
.logo-ring::after{
  content:'';
  position:absolute;
  inset:3px;
  border-radius:50%;
  background:var(--ink2);
}
.logo-img{
  position:absolute;
  inset:6px;
  border-radius:50%;
  overflow:hidden;
  z-index:2;
}
.logo-img img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:white;
}

.header-text h1{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
  font-weight:700;
}

.sub-title{
  font-weight: 400;
  color:var(--saffron);
  margin-top:4px;
}

.header-text p{
  font-size:18px;
  color:var(--saffron);
  margin-top:4px;
}

.announcement-banner{
  margin:10px 0 12px;
  border:1px solid rgba(232,130,12,0.3);
  background:linear-gradient(135deg,rgba(232,130,12,0.16),rgba(26,34,53,0.5));
  border-radius:14px;
  padding:12px 14px;
  display:none;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.announcement-banner.show{
  display:flex;
}

.announcement-title{
  font-size:13px;
  color:var(--saffron-pale);
  text-transform:uppercase;
  letter-spacing:0.8px;
  margin-bottom:4px;
}

.announcement-text{
  font-size:13px;
  color:var(--cream);
  line-height:1.5;
}

.announcement-close{
  border:none;
  background:rgba(255,255,255,0.07);
  color:var(--cream);
  width:28px;
  height:28px;
  border-radius:999px;
  cursor:pointer;
  flex-shrink:0;
}

.announcement-close:hover{
  background:rgba(244,63,94,0.2);
  color:#ffd7dd;
}

/* Chat Area */
.chat-box{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:40px 20px; /* increase top padding */
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  gap:14px;
  margin-bottom:20px;
  position:relative;
}

.chat-box::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:80px;
  pointer-events:none;
  z-index:5;

  background:linear-gradient(
    to bottom,
    rgba(14,17,23,1) 0%,
    rgba(14,17,23,0.85) 40%,
    rgba(14,17,23,0) 100%
  );
}

/* Styled scrollbar for webkit browsers */
.chat-box::-webkit-scrollbar{
  width:8px;
}

.chat-box::-webkit-scrollbar-track{
  background:rgba(255,255,255,0.04);
}

.chat-box::-webkit-scrollbar-thumb{
  background:rgba(232,130,12,0.4);
  border-radius:4px;
  transition:all 0.2s ease;
}

.chat-box::-webkit-scrollbar-thumb:hover{
  background:rgba(232,130,12,0.7);
}

.message{
  max-width:65%;
  padding:12px 16px;
  border-radius:14px;
  font-size:14px;
  border:1px solid var(--border-subtle);
  line-height:1.5;
  word-wrap:break-word;
  white-space:pre-wrap;
  
  opacity:0;
  transform:translateY(10px) scale(0.98);
  animation:smoothAppear 0.35s ease forwards;
}

.message.search-hit{
  box-shadow:0 0 0 2px rgba(245,169,58,0.45);
}

.message-row{
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.chat-box.select-mode .message-row{
  cursor:pointer;
}

.message-row.user-row{
  justify-content:flex-end;
}

.message-row.bot-row{
  justify-content:flex-start;
}

.msg-select{
  margin-top:10px;
  width:16px;
  height:16px;
  accent-color:var(--saffron);
  cursor:pointer;
}

.message.selected{
  box-shadow:0 0 0 2px rgba(232,130,12,0.55);
}

@keyframes smoothAppear{
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.bot{
  background:var(--msg-bot);
  align-self:flex-start;
}

.user{
  background:var(--msg-user);
  align-self:flex-end;
  color:white;
}

.message.bot.rich-reply{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.bot-head{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.7px;
  color:var(--muted);
}

.bot-source-badge{
  border:1px solid rgba(245,169,58,0.35);
  background:rgba(245,169,58,0.12);
  color:var(--saffron-pale);
  border-radius:999px;
  padding:2px 8px;
  font-weight:600;
}

.bot-content p{
  margin:0;
}

.bot-content p + p{
  margin-top:6px;
}

.bot-list{
  margin:0;
  padding-left:18px;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.bot-suggestions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.bot-feedback{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.feedback-btn,
.feedback-reason-btn{

<script>

// ================= USERNAME + GREETING =================
const username = localStorage.getItem("username");
const profileNameNode = document.getElementById("profile-card-name");
if (username) {
    if (profileNameNode) {
      profileNameNode.innerText = username;
    }

    const hour = new Date().getHours();

    if (hour < 12) greet = "Good Morning";
    else if (hour < 17) greet = "Good Afternoon";

    document.getElementById("greet-text").innerText = greet;
}

// ================= AUTH CHECK =================
const tokenCheck = localStorage.getItem("access_token");
if (!tokenCheck) {
    window.location.href = "/auth_ui.html";
}

const roleCheck = (localStorage.getItem("role") || "").trim().toLowerCase();
if (roleCheck === "admin") {
  window.location.href = "/admin_ui.html";
}

// ================= DOM REFERENCES =================
const chatBox = document.getElementById("chat-box");
const input = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const stopBtn = document.getElementById("stop-btn");
const conversationList = document.getElementById("conversation-list");
const editProfileBtn = document.getElementById("edit-profile-btn");
const chatOptionsBtn = document.getElementById("chat-options-btn");
const chatOptionsMenu = document.getElementById("chat-options-menu");
const chatLanguageControls = document.getElementById("chat-language-controls");
const selectedCountChip = document.getElementById("selected-count-chip");
const toggleSelectBtn = document.getElementById("toggle-select-btn");
const messageContextMenu = document.getElementById("message-context-menu");
const profileAvatarSlot = document.getElementById("profile-avatar-slot");
const profileCardName = document.getElementById("profile-card-name");
const profileCardSubtitle = document.getElementById("profile-card-subtitle");
const announcementBanner = document.getElementById("announcement-banner");
const announcementTitleNode = document.getElementById("announcement-title");
const announcementTextNode = document.getElementById("announcement-text");
const announcementCloseBtn = document.getElementById("announcement-close");
const API_BASE = window.location.origin;

async function enforceChatAccess() {
  const token = localStorage.getItem("access_token");
  if (!token) {
    window.location.href = "/auth_ui.html";
    return;
  }

  try {
    const meRes = await fetch(`${API_BASE}/auth/me`, {
      headers: { "Authorization": `Bearer ${token}` }
    });

    if (!meRes.ok) {
      localStorage.removeItem("access_token");
      localStorage.removeItem("role");
      window.location.href = "/auth_ui.html";
      return;
    }

    const me = await meRes.json();
    const role = (me.role || "").toString().trim().toLowerCase();
    localStorage.setItem("role", role || "user");
    if (role === "admin") {
      window.location.href = "/admin_ui.html";
    }
  } catch {
    // If role verification fails due transient network errors, keep current page.
  }
}

enforceChatAccess();
loadUserProfile();
applyChatLanguage(getChatLanguage());
loadActiveAnnouncement();

editProfileBtn?.addEventListener("click", openProfileModal);
chatOptionsBtn?.addEventListener("click", event => {
  event.stopPropagation();
  toggleChatOptionsMenu();
});
chatLanguageControls?.addEventListener("click", event => {
  const button = event.target.closest("[data-chat-language]");
  if (!button) return;
  const language = button.getAttribute("data-chat-language") || "auto";
  applyChatLanguage(language);
});
chatOptionsMenu?.addEventListener("click", handleChatOptionsClick);
messageContextMenu?.addEventListener("click", handleMessageContextMenuClick);
document.addEventListener("click", handleDocumentClick);

// ================= LOAD CONVERSATIONS FROM BACKEND =================
async function loadConversationsFromBackend() {
    try {
        const token = localStorage.getItem("access_token");
        const response = await fetch(`${API_BASE}/chat/history`, {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            const conversations = await response.json();
            // Convert backend format to frontend format
            const formattedConvs = conversations.map(conv => ({
              id: normalizeConversationId(conv.id),
                title: conv.title,
            messages: (Array.isArray(conv.messages) ? conv.messages : []).map(msg => ({
              id: normalizeMessageId(msg.id),
              role: msg.role === "user" ? "user" : "bot",
              text: msg.text || msg.content || "",
              meta: {
                ...(msg.meta || {}),
                feedback: parseFeedback(msg.feedback) || (msg.meta?.feedback || null)
              }
            })),
                pinned: false,
                archived: false
            }));
            
            // Update state with conversations from backend
            state.conversations = formattedConvs;
            localStorage.setItem("conversations", JSON.stringify(state.conversations));
            renderConversations();
        }
    } catch (error) {
        console.error("Error loading conversations:", error);
    }
}

// ================= WELCOME PROMPTS =================
const welcomePrompts = [
  "Welcome to REC Bijnor Academic AI. Ask me about departments, fees, placements, scholarships, or clubs.",
  "Need placement insights? Ask for year-wise company and package details.",
  "You can ask branch-wise fee details, scholarship options, and admission guidance.",
  "Try: 'Show CSE placement details with year and package'.",
  "I can also help with HOD information, exam queries, and timetable-related guidance.",
  "Ask me about hostels, labs, campus life, or student clubs whenever you need quick help.",
  "If you are planning admissions, I can help with eligibility, documents, and first steps.",
  "Need a department overview? I can summarize faculty, curriculum, and key academic details.",
  "From scholarships to semester support, I can guide you through common college questions.",
  "Want placement context? Ask for company names, package trends, and year-wise highlights.",
  "I can also point you to useful contacts like HODs, exam cells, and department guidance.",
  "Start with a simple question like 'What are the scholarship options for first-year students?'",
  "Need exam or timetable help? Ask directly and I’ll keep it simple and practical."
];

const welcomeConversationStarters = [
  "Can you tell me my profile name?",
  "Can we chat for a minute?",
  "What can you help me with?",
  "I feel confused about my next step"
];

  const welcomeBotMessages = [
    { title: "Hi there", message: "I'm your Academic AI assistant here at REC Bijnor. I'm ready to help you with anything about departments, admissions, fees, placements, clubs, and campus life. What would you like to know?" },
    { title: "Welcome", message: "I'm here to answer your questions about REC Bijnor quickly and clearly. Whether you're curious about placements, fees, courses, or student life, just ask." },
    { title: "Hello", message: "Great to meet you. I'm the Academic AI for REC Bijnor students. I can help with departments, placements, scholarships, and campus information." },
    { title: "Welcome to chat", message: "I can help with admissions info, fee structures, placement stats, department details, scholarships, and more. Ask me anything to get started." }
  ];

// ================= APP STATE =================
const state = {
    conversations: JSON.parse(localStorage.getItem("conversations")) || [],
    currentConversationId: localStorage.getItem("currentConversationId"),
  archivedExpanded: false,
  profile: null,
  selectedMessageIds: new Set(),
  activeRenderedConversationId: null,
  selectMode: false,
  contextMessageId: null,
  isAwaitingReply: false,
  searchRole: "all",
  currentAbortController: null,
  streamTimerId: null,
  streamCancelled: false
};

function normalizeConversationId(id) {
  if (id === null || id === undefined) return null;
  return String(id);
}

function isTemporaryConversationId(id) {
  return normalizeConversationId(id)?.startsWith("tmp-");
}

function findConversation(id) {
  const targetId = normalizeConversationId(id);
  return state.conversations.find(c => normalizeConversationId(c.id) === targetId);
}

function normalizeMessageId(id) {
  if (id === null || id === undefined || id === "") return null;
  return String(id);
}

function parseFeedback(rawFeedback) {
  if (!rawFeedback) return null;
  const value = String(rawFeedback).trim();
  if (!value) return null;
  const parts = value.split("|", 2);
  const sentiment = (parts[0] || "").trim().toLowerCase();
  if (!["up", "down"].includes(sentiment)) return null;
  return {
    sentiment,
    reason: (parts[1] || "").trim()
  };
}

function createLocalMessageId() {
  return `local-${Date.now()}-${Math.floor(Math.random() * 100000)}`;
}

function getMessageId(msg, idx = 0) {
  return normalizeMessageId(msg?.id) || `legacy-${idx}-${Math.floor(Math.random() * 100000)}`;
}

function getChatLanguage() {
  const language = String(localStorage.getItem("chatLanguage") || "auto").toLowerCase();
  return ["auto", "en", "hi"].includes(language) ? language : "auto";
}

function applyChatLanguage(language) {
  const nextLanguage = ["auto", "en", "hi"].includes(language) ? language : "auto";
  localStorage.setItem("chatLanguage", nextLanguage);
  document.querySelectorAll("[data-chat-language]").forEach(button => {
    button.classList.toggle("active", button.getAttribute("data-chat-language") === nextLanguage);
  });
}

function getDismissedAnnouncementId() {
  return String(localStorage.getItem("dismissedAnnouncementId") || "");
}

function dismissAnnouncement(announcementId) {
  localStorage.setItem("dismissedAnnouncementId", String(announcementId || ""));
  announcementBanner?.classList.remove("show");
}

function resetDismissedAnnouncement() {
  localStorage.removeItem("dismissedAnnouncementId");
}

async function loadActiveAnnouncement() {
  const token = localStorage.getItem("access_token");
  if (!token || !announcementBanner) return;

  try {
    const response = await fetch(`${API_BASE}/announcements/active`, {
      headers: { "Authorization": `Bearer ${token}` }
    });
    if (!response.ok) return;

    const data = await response.json();
    const announcement = data?.announcement;
    if (!announcement || !announcement.message) {
      announcementBanner.classList.remove("show");
      return;
    }

    const announcementId = String(announcement.id || "");
    if (announcementId && announcementId === getDismissedAnnouncementId()) {
      announcementBanner.classList.remove("show");
      return;
    }

    if (announcementTitleNode) {
      announcementTitleNode.textContent = announcement.title || "Announcement";
    }
    if (announcementTextNode) {
      announcementTextNode.textContent = announcement.message || "";
    }
    announcementBanner.classList.add("show");

    if (announcementCloseBtn) {
      announcementCloseBtn.onclick = () => dismissAnnouncement(announcementId);
    }
  } catch {
    // Keep chat usable even if announcement call fails.
  }
}

state.conversations = state.conversations.map(conv => ({
  ...conv,
  id: normalizeConversationId(conv.id),
  messages: (conv.messages || []).map((msg, idx) => ({
    id: getMessageId(msg, idx),
    role: msg.role === "user" ? "user" : "bot",
    text: msg.text || msg.content || "",
    meta: {
      ...(msg.meta || {}),
      feedback: parseFeedback(msg.feedback) || (msg.meta?.feedback || null)
    }
  }))
}));
state.currentConversationId = normalizeConversationId(state.currentConversationId);

function updateState(newState = {}) {
    Object.assign(state, newState);
  state.conversations = state.conversations.map(conv => ({
    ...conv,
    id: normalizeConversationId(conv.id),
    messages: (conv.messages || []).map((msg, idx) => ({
      id: getMessageId(msg, idx),
      role: msg.role === "user" ? "user" : "bot",
      text: msg.text || msg.content || "",
      meta: {
        ...(msg.meta || {}),
        feedback: parseFeedback(msg.feedback) || (msg.meta?.feedback || null)
      }
    }))
  }));
  state.currentConversationId = normalizeConversationId(state.currentConversationId);
    localStorage.setItem("conversations", JSON.stringify(state.conversations));
    localStorage.setItem("currentConversationId", state.currentConversationId);
    renderConversations();
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function formatInline(text) {
  return String(text || "")
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/__(.*?)__/g, "<em>$1</em>");
}

function sourceLabel(sourceValue) {
  const source = String(sourceValue || "").toLowerCase();
  if (!source) return "Academic AI";
  const labels = {
    groq: "AI Model",
    structured: "Verified Data",
    semantic: "Semantic Match",
    faq: "FAQ",
    "scope-guard": "Scope Guard",
    fallback: "Fallback"
  };
  return labels[source] || "Academic AI";
}

function renderBotContentHtml(text) {
  const safeText = escapeHtml(text);
  const lines = safeText.split(/\n+/).map(line => line.trim()).filter(Boolean);
  if (!lines.length) {
    return `<div class="bot-content"><p>I am here to help with REC Bijnor academic queries.</p></div>`;
  }

  let html = '<div class="bot-content">';
  let listOpen = false;
  lines.forEach(line => {
    const bulletMatch = line.match(/^[-*]\s+(.*)$/);
    if (bulletMatch) {
      if (!listOpen) {
        html += '<ul class="bot-list">';
        listOpen = true;
      }
      html += `<li>${formatInline(bulletMatch[1])}</li>`;
      return;
    }

    if (listOpen) {
      html += '</ul>';
      listOpen = false;
    }
    html += `<p>${formatInline(line)}</p>`;
  });

  if (listOpen) {
    html += '</ul>';
  }
  html += '</div>';
  return html;
}

function renderSuggestionChips(meta = {}) {
  const suggestions = Array.isArray(meta?.suggestions)
    ? meta.suggestions.filter(Boolean).slice(0, 3)
    : [];

  if (!suggestions.length) {
    return "";
  }

  const chips = suggestions
    .map(item => `<button type="button" class="suggestion-chip-btn" data-suggestion="${escapeHtml(item)}">${escapeHtml(item)}</button>`)
    .join("");

  return `<div class="bot-suggestions">${chips}</div>`;
}

function renderFeedbackControls(message) {
  const feedback = message?.meta?.feedback || null;
  const selected = feedback?.sentiment || "";
  const selectedReason = (feedback?.reason || "").trim();
  const messageId = normalizeMessageId(message?.id);
  if (!messageId) return "";

  const reasons = [
    "Incorrect info",
    "Outdated answer",
    "Not clear",
    "Needs more detail"
  ];

  const reasonButtons = reasons.map(reason => {
    const activeClass = selected === "down" && selectedReason === reason ? "active" : "";
    return `<button type="button" class="feedback-reason-btn ${activeClass}" data-feedback-message-id="${escapeHtml(messageId)}" data-feedback-reason="${escapeHtml(reason)}">${escapeHtml(reason)}</button>`;
  }).join("");

  const downActiveClass = selected === "down" ? "active" : "";
  const upActiveClass = selected === "up" ? "active" : "";

  return `
    <div class="bot-feedback" data-feedback-wrap-id="${escapeHtml(messageId)}">
      <button type="button" class="feedback-btn ${upActiveClass}" data-feedback-message-id="${escapeHtml(messageId)}" data-feedback-sentiment="up" title="Helpful">👍 Helpful</button>
      <button type="button" class="feedback-btn ${downActiveClass}" data-feedback-message-id="${escapeHtml(messageId)}" data-feedback-sentiment="down" title="Not helpful">👎 Not helpful</button>
    </div>
    ${selected === "down" ? `<div class="feedback-reasons">${reasonButtons}</div>` : ""}
  `;
}

function renderBotMessageHtml(message) {
  const meta = message?.meta || {};
  const head = `
    <div class="bot-head">
      <span>Academic AI</span>
      <span class="bot-source-badge">${escapeHtml(sourceLabel(meta.source))}</span>
    </div>
  `;
  const body = renderBotContentHtml(message?.text || message?.content || "");
  const suggestions = renderSuggestionChips(meta);
  const feedback = renderFeedbackControls(message);
  return `${head}${body}${suggestions}${feedback}`;
}

async function submitFeedback(messageId, sentiment, reason = "") {
  const token = localStorage.getItem("access_token");
  if (!token) return;
  try {
    const response = await fetch(`${API_BASE}/chat/messages/${messageId}/feedback`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({ sentiment, reason })
    });
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(data.detail || "Could not save feedback");
    }

    const payload = await response.json();
    const feedback = payload?.feedback || { sentiment, reason };
    const conv = findConversation(state.currentConversationId);
    if (!conv) return;

    conv.messages = conv.messages.map(msg => {
      if (normalizeMessageId(msg.id) !== normalizeMessageId(messageId)) return msg;
      return {
        ...msg,
        meta: {
          ...(msg.meta || {}),
          feedback
        }
      };
    });

    updateState();
    loadConversation(state.currentConversationId, { preserveSelection: true });
  } catch (error) {
    alert(error.message || "Could not save feedback");
  }
}

function stopStreamingReply() {

const STREAM_STYLE = "cinematic";
const STREAM_STYLES = {
  fast: {
    lookahead: 18,
    minChunk: 4,
    maxChunk: 9,
    firstDelayMin: 18,
    firstDelayJitter: 16,
    baseDelayMin: 14,
    baseDelayJitter: 14,
    softPauseMin: 30,
    softPauseJitter: 20,
    hardPauseMin: 70,
    hardPauseJitter: 35,
    newlineExtraPause: 40,
  },
  cinematic: {
    lookahead: 26,
    minChunk: 2,
    maxChunk: 7,
    firstDelayMin: 70,
    firstDelayJitter: 45,
    baseDelayMin: 26,
    baseDelayJitter: 24,
    softPauseMin: 75,
    softPauseJitter: 40,
    hardPauseMin: 150,
    hardPauseJitter: 80,
    newlineExtraPause: 90,
  }
};

function getStreamStyleConfig() {
  return STREAM_STYLES[STREAM_STYLE] || STREAM_STYLES.fast;
}

function computeNextStreamIndex(text, currentIndex, config) {
  if (currentIndex >= text.length) return text.length;

  const remaining = text.length - currentIndex;
  const lookahead = Math.min(config.lookahead, remaining);
  const slice = text.slice(currentIndex, currentIndex + lookahead);

  const hardPauseMatch = slice.match(/[.!?\n]/);
  if (hardPauseMatch && hardPauseMatch.index !== undefined && hardPauseMatch.index >= 2) {
    return currentIndex + hardPauseMatch.index + 1;
  }

  const softPauseMatch = slice.match(/[,;:]/);
  if (softPauseMatch && softPauseMatch.index !== undefined && softPauseMatch.index >= 3) {
    return currentIndex + softPauseMatch.index + 1;
  }

  const whitespaceMatch = slice.slice(2).match(/\s/);
  if (whitespaceMatch && whitespaceMatch.index !== undefined) {
    return currentIndex + 2 + whitespaceMatch.index + 1;
  }

  const chunkRange = Math.max(1, config.maxChunk - config.minChunk + 1);
  const chunk = Math.min(remaining, config.minChunk + Math.floor(Math.random() * chunkRange));
  return currentIndex + chunk;
}

function computeStreamDelay(chunkText, config) {
  const value = String(chunkText || "");
  if (!value) {
    return config.baseDelayMin;
  }

  const lastChar = value[value.length - 1];
  if (/[.!?\n]/.test(lastChar)) {
    const extra = lastChar === "\n" ? config.newlineExtraPause : 0;
    return config.hardPauseMin + Math.floor(Math.random() * config.hardPauseJitter) + extra;
  }
  if (/[,;:]/.test(lastChar)) {
    return config.softPauseMin + Math.floor(Math.random() * config.softPauseJitter);
  }
  return config.baseDelayMin + Math.floor(Math.random() * config.baseDelayJitter);
}

function streamAssistantReply(fullText, meta = {}, botMessageId = null) {
  const text = String(fullText || "");
  if (!text) {
    saveMessage("bot", "", botMessageId, meta);
    loadConversation(state.currentConversationId);
    return Promise.resolve();
  }

  return new Promise(resolve => {
    const streamConfig = getStreamStyleConfig();

    const row = document.createElement("div");
    row.className = "message-row bot-row streaming-row";
    row.id = "streaming-row";

    const bubble = document.createElement("div");
    bubble.className = "message bot rich-reply";
    bubble.innerHTML = `
      <div class="bot-head">
        <span>Academic AI</span>
        <span class="bot-source-badge">${escapeHtml(sourceLabel(meta?.source))}</span>
      </div>
      <div class="streaming-content" id="streaming-content"></div>
    `;

    row.appendChild(bubble);
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;

    const contentNode = document.getElementById("streaming-content");
    let revealed = 0;
    state.streamCancelled = false;

    const streamStep = () => {
      if (state.streamCancelled) {
        clearTimeout(state.streamTimerId);
        state.streamTimerId = null;
        document.getElementById("streaming-row")?.remove();

        const partial = text.slice(0, revealed).trim();
        if (partial) {
          saveMessage("bot", `${partial}\n\n(Generation stopped)`, createLocalMessageId(), {
            ...meta,
            source: meta?.source || "fallback"
          });
        }
        loadConversation(state.currentConversationId);
        resolve();
        return;
      }

      const nextIndex = computeNextStreamIndex(text, revealed, streamConfig);
      revealed = Math.min(text.length, nextIndex);
      if (contentNode) {
        contentNode.textContent = text.slice(0, revealed);
      }
      chatBox.scrollTop = chatBox.scrollHeight;

      if (revealed >= text.length) {
        clearTimeout(state.streamTimerId);
        state.streamTimerId = null;
        document.getElementById("streaming-row")?.remove();
        saveMessage("bot", text, botMessageId, meta);
        loadConversation(state.currentConversationId);
        resolve();
        return;
      }

      const currentChunk = text.slice(Math.max(0, revealed - 24), revealed);
      const delay = computeStreamDelay(currentChunk, streamConfig);
      state.streamTimerId = setTimeout(streamStep, delay);
    };

    const firstDelay = streamConfig.firstDelayMin + Math.floor(Math.random() * streamConfig.firstDelayJitter);
    state.streamTimerId = setTimeout(streamStep, firstDelay);
  });
}

function startAssistantWaitState() {
  state.isAwaitingReply = true;

  sendBtn.disabled = true;
  input.disabled = true;
  input.placeholder = "";
  if (stopBtn) stopBtn.style.display = "inline-flex";

function stopAssistantWaitState() {
  state.isAwaitingReply = false;
  sendBtn.disabled = false;
  input.disabled = false;
  input.placeholder = "Type your message...";
  if (stopBtn) stopBtn.style.display = "none";
}

function cancelAssistantReply() {
  if (!state.isAwaitingReply) return;
  if (state.currentAbortController) {
    state.currentAbortController.abort();
    return;
  }
  if (state.streamTimerId) {
    stopStreamingReply();
  }
}

function getProfileLabel(profile) {
  const displayName = (profile?.display_name || profile?.username || username || "User").trim();
  const sections = [profile?.department, profile?.semester, profile?.year].filter(Boolean);
  return {
    name: displayName,
    subtitle: sections.length ? sections.join(" · ") : "Add a photo, department, phone, and more.",
  };
}

function getProfileInitials(nameValue) {
  const parts = String(nameValue || "U").trim().split(/\s+/).filter(Boolean).slice(0, 2);
  return parts.map(part => part[0]?.toUpperCase() || "U").join("") || "U";
}

function renderProfileSection(profile) {
  state.profile = profile || null;
  const info = getProfileLabel(profile);
  const photoData = profile?.photo_data || "";
  const initials = getProfileInitials(info.name);

    ? `<img src="${photoData}" alt="Profile photo">`
    : `<span>${initials}</span>`;

  if (profileAvatarSlot) profileAvatarSlot.innerHTML = avatarMarkup;
  if (profileCardName) profileCardName.textContent = info.name;
  if (profileCardSubtitle) profileCardSubtitle.textContent = info.subtitle;
}

async function deleteConversationById(id) {
  const conversationId = normalizeConversationId(id);
  if (!conversationId) return;

  const conv = findConversation(conversationId);
  const label = conv?.title || "this chat";
  const confirmDelete = confirm(`Delete ${label}? This cannot be undone.`);
  if (!confirmDelete) return;

  try {
    if (!isTemporaryConversationId(conversationId)) {
      const token = localStorage.getItem("access_token");
      const response = await fetch(`${API_BASE}/chat/conversations/${conversationId}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || "Could not delete chat");
      }
    }

    const deletingCurrent = normalizeConversationId(state.currentConversationId) === conversationId;
    const remainingConversations = state.conversations.filter(c => normalizeConversationId(c.id) !== conversationId);
    const nextConversation = deletingCurrent ? remainingConversations.find(c => !c.archived) || null : findConversation(state.currentConversationId);

    updateState({
      conversations: remainingConversations,
      currentConversationId: nextConversation ? nextConversation.id : null
    });

    if (deletingCurrent) {
      if (nextConversation) {
        loadConversation(nextConversation.id);
      } else {
        createNewConversation();
        showWelcomeWithBotGreeting();
      }
    }
  } catch (error) {
    alert(error.message || "Could not delete chat");
  }
}

function handleDocumentClick(event) {
  if (messageContextMenu && !messageContextMenu.contains(event.target)) {
    closeMessageContextMenu();
  }

  if (chatOptionsMenu && chatOptionsBtn) {
    const clickedInsideMenu = chatOptionsMenu.contains(event.target);
    const clickedButton = chatOptionsBtn.contains(event.target);
    if (!clickedInsideMenu && !clickedButton) {

}

function handleMessageContextMenuClick(event) {
  const item = event.target.closest("[data-msg-action]");
  if (!item) return;

  const action = item.getAttribute("data-msg-action");
  const messageId = state.contextMessageId;
  if (!messageId) return;

  if (action === "toggle-select") {
    setSelectMode(true);
    const shouldSelect = !state.selectedMessageIds.has(messageId);
    toggleMessageSelection(messageId, shouldSelect);
    loadConversation(state.currentConversationId, { preserveSelection: true });
  }

  if (action === "copy") {
    const message = getMessageById(messageId);
    if (message) {
      navigator.clipboard.writeText(String(message.text || message.content || ""));
    }
  }

  if (action === "delete-single") {
    openDeleteMessagesPreviewModal([messageId], "Delete this message?");
  }

  closeMessageContextMenu();
}

function handleChatOptionsClick(event) {
  const actionButton = event.target.closest("[data-chat-action]");
  if (!actionButton) return;
  const action = actionButton.getAttribute("data-chat-action");

  switch (action) {
    case "toggle-select-mode":
      setSelectMode(!state.selectMode);
      break;
    case "select-all":
      setSelectMode(true);
      selectAllMessagesInCurrentChat();
      break;
    case "delete-selected":
      deleteSelectedMessages();
      break;
    case "export-chat":
      exportCurrentChat();
      break;
    case "clear-chat":
      clearCurrentChatMessages();
      break;
    default:
      break;
  }

  closeChatOptionsMenu();
}

function toggleMessageSelection(messageId, isSelected) {

function getMessageById(messageId) {

  if (!conv || !Array.isArray(conv.messages)) return null;
  const normalizedId = normalizeMessageId(messageId);
  return conv.messages.find(msg => normalizeMessageId(msg.id) === normalizedId) || null;
}

function getMessagesByIds(messageIds = []) {
  const conv = findConversation(state.currentConversationId);
  if (!conv || !Array.isArray(conv.messages)) return [];
  const wanted = new Set(messageIds.map(normalizeMessageId));
  return conv.messages.filter(msg => wanted.has(normalizeMessageId(msg.id)));
}

function openDeleteMessagesPreviewModal(messageIds = [], title = "Delete selected messages?") {
  const normalizedIds = messageIds.map(normalizeMessageId).filter(Boolean);
  if (!normalizedIds.length) {
    alert("No messages selected.");
    return;

    alert("Selected messages were not found.");
    return;

  }).join("");

async function deleteMessagesByIds(messageIds = []) {
  const conv = findConversation(state.currentConversationId);
  if (!conv) return;

  const selectedIds = messageIds.map(normalizeMessageId).filter(Boolean);
  if (!selectedIds.length) return;

  const persistedMessageIds = selectedIds
    .map(id => Number(id))
    .filter(Number.isInteger);

  try {
    const conversationId = normalizeConversationId(state.currentConversationId);
    const isPersistedConversation = conversationId && !isTemporaryConversationId(conversationId);

    if (isPersistedConversation && persistedMessageIds.length > 0) {
      const token = localStorage.getItem("access_token");
      const response = await fetch(`${API_BASE}/chat/conversations/${conversationId}/messages`, {
        method: "DELETE",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ message_ids: persistedMessageIds })
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || "Could not delete selected messages");
      }
    }

    const deletingSet = new Set(selectedIds);
    conv.messages = conv.messages.filter(msg => !deletingSet.has(normalizeMessageId(msg.id)));

    selectedIds.forEach(id => state.selectedMessageIds.delete(id));
    updateSelectionBadge();
    updateState();
    loadConversation(state.currentConversationId, { preserveSelection: true });
  } catch (error) {
    alert(error.message || "Could not delete selected messages");
  }
}

async function deleteSelectedMessages() {
  const conv = findConversation(state.currentConversationId);
  if (!conv) return;

  const selectedIds = Array.from(state.selectedMessageIds);
  if (!selectedIds.length) {
    alert("Select one or more messages to delete.");
    return;
  }

  openDeleteMessagesPreviewModal(selectedIds, `Delete ${selectedIds.length} selected message(s)?`);
}

function selectAllMessagesInCurrentChat() {

  loadConversation(state.currentConversationId, { preserveSelection: true });
}

async function clearCurrentChatMessages() {
  const conv = findConversation(state.currentConversationId);
  if (!conv) return;
  if (!Array.isArray(conv.messages) || conv.messages.length === 0) {
    alert("This chat is already empty.");
    return;
  }

  const confirmed = confirm("Clear all messages in this chat? This cannot be undone.");
  if (!confirmed) return;

  const allMessageIds = conv.messages
    .map(msg => Number(normalizeMessageId(msg.id)))
    .filter(Number.isInteger);

  try {
    const conversationId = normalizeConversationId(state.currentConversationId);
    const isPersistedConversation = conversationId && !isTemporaryConversationId(conversationId);

    if (isPersistedConversation && allMessageIds.length > 0) {
      const token = localStorage.getItem("access_token");
      const response = await fetch(`${API_BASE}/chat/conversations/${conversationId}/messages`, {
        method: "DELETE",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ message_ids: allMessageIds })
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || "Could not clear this chat");
      }
    }

    conv.messages = [];
    clearSelectedMessages();
    updateState();
    loadConversation(state.currentConversationId);
  } catch (error) {
    alert(error.message || "Could not clear this chat");
  }
}

function exportCurrentChat() {
  const conv = findConversation(state.currentConversationId);
  if (!conv || !Array.isArray(conv.messages) || conv.messages.length === 0) {
    alert("No messages available to export.");
    return;
  }

  const lines = [
    `Chat: ${conv.title || "Untitled Chat"}`,
    `Exported at: ${new Date().toLocaleString("en-IN")}`,
    ""
  ];

  conv.messages.forEach(msg => {
    const role = msg.role === "user" ? "User" : "Bot";
    lines.push(`${role}: ${msg.text || msg.content || ""}`);
  });

  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `chat-${normalizeConversationId(conv.id) || Date.now()}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ================= CREATE NEW CHAT =================
function createNewConversation() {

  clearSelectedMessages();
  state.selectMode = false;
  updateSelectionBadge();

    // Remove previous empty conversation if exists
    if (state.currentConversationId) {
        const existing = state.conversations.find(
            c => c.id === state.currentConversationId
        );

        if (existing && existing.messages.length === 0) {
            state.conversations = state.conversations.filter(
                c => c.id !== existing.id
            );
        }
    }

    const id = `tmp-${Date.now()}`;

    const newConv = {
        id,
        title: "New Chat",
        messages: [],
        pinned: false,
        archived: false
    };

    updateState({
        conversations: [newConv, ...state.conversations],
        currentConversationId: id
    });

    loadConversation(id);
}

// ================= WELCOME PROMPT =================

// ================= CREATE CONVERSATION ITEM =================
function createConversationItem(conv) {
  const convId = normalizeConversationId(conv.id);

    const wrapper = document.createElement("div");
    wrapper.className = "conversation-item";
  wrapper.onclick = () => {
      clearSelectedMessages();
      state.activeRenderedConversationId = null;
    updateState({ currentConversationId: convId });
    loadConversation(convId);
  };

    const title = document.createElement("span");
    title.textContent = conv.pinned ? "📌 " + conv.title : conv.title;

    wrapper.appendChild(title);
    conversationList.appendChild(wrapper);
}

// ================= RENDER SIDEBAR =================
function renderConversations() {

    conversationList.innerHTML = "";

    const pastConversations = state.conversations
        .filter(c => !c.archived)
        .sort((a, b) => {
            if (a.pinned === b.pinned) return 0;
            return a.pinned ? -1 : 1;
        });

    const archived = state.conversations.filter(c => c.archived);

    // Past Conversations
    if (pastConversations.length > 0) {
        const sectionTitle = document.createElement("div");
        sectionTitle.className = "section-title";
        sectionTitle.innerText = "Past Conversations";
        conversationList.appendChild(sectionTitle);

        pastConversations.forEach(conv => {
            createConversationItem(conv);
        });
    }

    // Archived (Collapsible)
    if (archived.length > 0) {

        const archivedHeader = document.createElement("div");
        archivedHeader.className = "section-title";
        archivedHeader.style.marginTop = "25px";
        archivedHeader.style.cursor = "pointer";
        archivedHeader.innerText =
            (state.archivedExpanded ? "▼ " : "▶ ") +
            `Archived (${archived.length})`;

        archivedHeader.onclick = () => {
            state.archivedExpanded = !state.archivedExpanded;
            renderConversations();
        };

        conversationList.appendChild(archivedHeader);

        if (state.archivedExpanded) {
            archived.forEach(conv => {
                createConversationItem(conv);
            });
        }
    }
}

// ================= LOAD CHAT =================
function loadConversation(id, options = {}) {
  const { preserveSelection = false } = options;

  const conv = findConversation(id);
    if (!conv) return;

    const incomingId = normalizeConversationId(id);
    if (!preserveSelection && incomingId !== state.activeRenderedConversationId) {
      clearSelectedMessages();
    }
    state.activeRenderedConversationId = incomingId;

    chatBox.innerHTML = "";
    chatBox.classList.toggle("select-mode", state.selectMode);
    const searchQuery = getCurrentSearchQuery();
    const roleFilter = state.searchRole || "all";

    if (!Array.isArray(conv.messages) || conv.messages.length === 0) {
        updateSearchSummary(0, 0, searchQuery, roleFilter);
        showWelcomeWithBotGreeting();
        return;
    }

    let renderedCount = 0;

    conv.messages.forEach((msg, idx) => {
      const role = msg.role === "user" ? "user" : "bot";
      const safeText = msg.text || msg.content || "";
      const messageId = getMessageId(msg, idx);
      const roleMatch = roleFilter === "all" || role === roleFilter;
      const textMatch = !searchQuery || safeText.toLowerCase().includes(searchQuery);
      if (!roleMatch || !textMatch) {
        return;
      }

      renderedCount += 1;
      const isSearchHit = Boolean(searchQuery);
      msg.id = messageId;

      const row = document.createElement("div");
      row.className = `message-row ${role}-row`;

      const bubble = document.createElement("div");
      bubble.className = "message " + role;
      if (isSearchHit) bubble.classList.add("search-hit");
      if (state.selectedMessageIds.has(messageId)) bubble.classList.add("selected");
      bubble.addEventListener("contextmenu", event => {
        openMessageContextMenu(event, messageId);
      });
      bubble.addEventListener("click", () => {
        if (!state.selectMode) return;
        const shouldSelect = !state.selectedMessageIds.has(messageId);
        toggleMessageSelection(messageId, shouldSelect);
        loadConversation(state.currentConversationId, { preserveSelection: true });
      });

      if (role === "bot") {
        bubble.classList.add("rich-reply");
        bubble.innerHTML = renderBotMessageHtml(msg);
      } else {
        bubble.textContent = safeText;
      }

      if (state.selectMode) {
        const selectBox = document.createElement("input");
        selectBox.type = "checkbox";
        selectBox.className = "msg-select";
        selectBox.checked = state.selectedMessageIds.has(messageId);
        selectBox.addEventListener("click", e => e.stopPropagation());
        selectBox.addEventListener("change", () => {
          toggleMessageSelection(messageId, selectBox.checked);
          loadConversation(state.currentConversationId, { preserveSelection: true });
        });

        if (role === "user") {
          row.appendChild(selectBox);
          row.appendChild(bubble);
        } else {
          row.appendChild(bubble);
          row.appendChild(selectBox);
        }
      } else {
        row.appendChild(bubble);
      }

      chatBox.appendChild(row);
    });

    updateSearchSummary(renderedCount, conv.messages.length, searchQuery, roleFilter);

    if (renderedCount === 0) {
      const empty = document.createElement("div");
      empty.className = "hero-welcome";
      empty.style.fontSize = "19px";
      empty.style.maxWidth = "640px";
      empty.innerText = "No messages matched this academic filter. Try changing role or clearing search.";
      chatBox.appendChild(empty);
      return;
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}

// ================= SAVE MESSAGE =================
function saveMessage(role, text, messageId = null, meta = {}) {

  const conv = findConversation(state.currentConversationId);

    if (!conv) return;

    conv.messages.push({
      id: normalizeMessageId(messageId) || createLocalMessageId(),
      role,
      text,
      meta: meta || {}
    });

    if (conv.title === "New Chat") {
        conv.title = text.substring(0, 25);
    }

    updateState();
}

// ================= SEND MESSAGE =================
async function sendMessage(prefilledMessage = "") {

  const rawMessage = prefilledMessage || input.value;
  const msg = rawMessage.trim();
    if (!msg) return;
  if (state.isAwaitingReply) return;

    if (chatBox.querySelector(".hero-welcome")) {
        chatBox.innerHTML = "";
    }

    if (!state.currentConversationId) {
        createNewConversation();
    }

    const userMessageId = createLocalMessageId();

    saveMessage("user", msg, userMessageId);
    loadConversation(state.currentConversationId);

    input.value = "";
    chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: "smooth" });

    const token = localStorage.getItem("access_token");
    if (!token) {
        alert("Session expired. Please login again.");
        window.location.href = "/auth_ui.html";
        return;
    }

    startAssistantWaitState();
    state.currentAbortController = new AbortController();

    try {
      const activeConversationId = normalizeConversationId(state.currentConversationId);
      const conversationIdForApi = activeConversationId && !isTemporaryConversationId(activeConversationId)
        ? Number(activeConversationId)
        : null;

        const response = await fetch(`${API_BASE}/chat`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
        body: JSON.stringify({
          message: msg,
          conversation_id: conversationIdForApi
        }),
        signal: state.currentAbortController.signal
        });

        if (!response.ok) {
          let errorMsg = "I could not process that right now. Please try again.";
          try {
            const errData = await response.json();
            if (errData?.detail) {
              errorMsg = String(errData.detail);
            }
          } catch {
            // Keep default fallback error text.
          }
          saveMessage("bot", errorMsg, createLocalMessageId(), { source: "fallback" });
          loadConversation(state.currentConversationId);
          return;
        }

        const data = await response.json();
        state.currentAbortController = null;

      if (data.conversation_id) {
        const serverConversationId = normalizeConversationId(data.conversation_id);

        if (activeConversationId && isTemporaryConversationId(activeConversationId)) {
          const localConversation = findConversation(activeConversationId);
          if (localConversation) {
            localConversation.id = serverConversationId;
          }
          state.currentConversationId = serverConversationId;
          updateState();
        } else if (serverConversationId && state.currentConversationId !== serverConversationId) {
          state.currentConversationId = serverConversationId;
          updateState();
        }
      }

        const activeConv = findConversation(state.currentConversationId);
        if (activeConv) {
          const lastUserMessage = [...activeConv.messages].reverse().find(m => m.role === "user");
          if (lastUserMessage && data.user_message_id) {
            lastUserMessage.id = normalizeMessageId(data.user_message_id);
          }
        }

        await streamAssistantReply(data.reply, {
          category: data.category || "General",
          suggestions: Array.isArray(data.suggestions) ? data.suggestions : [],
          source: data.source || "groq"
        }, data.bot_message_id);

        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: "smooth" });

    } catch (error) {
        if (error?.name === "AbortError") {
          saveMessage(
            "bot",
            "Stopped the current response. You can ask a new question anytime.",
            createLocalMessageId(),
            { source: "fallback" }
          );
          loadConversation(state.currentConversationId);
          return;
        }
        console.error("Fetch error:", error);
        saveMessage(
          "bot",
          "Network issue occurred while contacting Academic AI. Please retry in a moment.",
          createLocalMessageId(),
          { source: "fallback" }
        );
        loadConversation(state.currentConversationId);
    } finally {
      state.currentAbortController = null;
      stopAssistantWaitState();
    }
}

// ================= CONVERSATION ACTIONS =================
function shareConversation(id) {
  const conv = findConversation(id);
    if (!conv) return;

    const text = conv.messages
        .map(m => `${m.role.toUpperCase()}: ${m.text}`)
        .join("\n");

    navigator.clipboard.writeText(text);
    alert("Conversation copied to clipboard");
}

function renameConversation(id) {
  const conv = findConversation(id);
    if (!conv) return;

    const newTitle = prompt("Enter new name:", conv.title);
    if (!newTitle) return;

    conv.title = newTitle.trim();
    updateState();
}

function togglePin(id) {
  const conv = findConversation(id);
    if (!conv) return;

    conv.pinned = !conv.pinned;
    updateState();
}

function archiveConversation(id) {
  const conv = findConversation(id);
    if (!conv) return;

    conv.archived = true;
    conv.pinned = false;

    const wasCurrent = normalizeConversationId(state.currentConversationId) === normalizeConversationId(id);
    updateState();

    if (wasCurrent) {
        const next = state.conversations.find(c => !c.archived);
        if (next) {
            updateState({ currentConversationId: next.id });
            loadConversation(next.id);
        } else {
            state.currentConversationId = null;
            createNewConversation();
            showWelcomeWithBotGreeting();
        }
    }
}

function restoreConversation(id) {
  const conv = findConversation(id);
    if (!conv) return;

    conv.archived = false;
    updateState();
}

function deleteConversation(id) {
  deleteConversationById(id);
}

function closeDropdowns() {
    document.querySelectorAll(".dropdown")
        .forEach(d => d.style.display = "none");
}

document.addEventListener("click", closeDropdowns);

conversationList.addEventListener("click", function (e) {

    const action = e.target.dataset.action;
    const id = e.target.dataset.id;

    if (!action || !id) return;

    switch (action) {
        case "share": shareConversation(id); break;
        case "rename": renameConversation(id); break;
        case "toggle-pin": togglePin(id); break;
        case "archive": archiveConversation(id); break;
        case "restore": restoreConversation(id); break;
        case "delete": deleteConversation(id); break;
    }

    closeDropdowns();
});

// ================= EVENTS =================
sendBtn.addEventListener("click", sendMessage);
stopBtn?.addEventListener("click", cancelAssistantReply);

chatBox.addEventListener("click", event => {
  // Handle suggestion chips
  const suggestionBtn = event.target.closest(".suggestion-chip-btn");
  if (suggestionBtn) {
    const suggestion = suggestionBtn.getAttribute("data-suggestion") || "";
    if (!suggestion.trim()) return;
    sendMessage(suggestion);
    return;
  }

  // Handle feedback sentiment buttons (👍 up / 👎 down)
  const feedbackBtn = event.target.closest(".feedback-btn");
  if (feedbackBtn) {
    const messageId = feedbackBtn.getAttribute("data-feedback-message-id");
    const sentiment = feedbackBtn.getAttribute("data-feedback-sentiment");
    if (!messageId || !sentiment) return;

    const wrapElement = feedbackBtn.closest(".bot-feedback");
    const reasonContainer = wrapElement?.nextElementSibling;
    const isCurrentlyActive = feedbackBtn.classList.contains("active");

    // If clicking active button, toggle off (deselect)
    if (isCurrentlyActive && sentiment !== "up") {
      submitFeedback(messageId, "", "");
    } else if (sentiment === "up") {
      // Helpful vote: clear reason and submit up sentiment
      submitFeedback(messageId, "up", "");
    } else if (sentiment === "down") {
      // Not helpful vote: if no reason selected yet, just mark sentiment and show reasons
      const currentFeedback = findConversation(state.currentConversationId)?.messages
        ?.find(m => normalizeMessageId(m.id) === normalizeMessageId(messageId))?.meta?.feedback;
      const hasReasonSelected = currentFeedback?.reason && currentFeedback.sentiment === "down";
      if (!hasReasonSelected) {
        // Just mark sentiment without reason yet; UI will re-render to show reasons
        submitFeedback(messageId, "down", "");
      }
    }
    return;
  }

  // Handle feedback reason buttons
  const reasonBtn = event.target.closest(".feedback-reason-btn");
  if (reasonBtn) {
    const messageId = reasonBtn.getAttribute("data-feedback-message-id");
    const reason = reasonBtn.getAttribute("data-feedback-reason");
    if (!messageId || !reason) return;
    submitFeedback(messageId, "down", reason);
    return;
  }
});

input.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
});

document.querySelector(".new-chat")
    .addEventListener("click", () => {
        createNewConversation();
    resetDismissedAnnouncement();
    loadActiveAnnouncement();
        showWelcomeWithBotGreeting();
    closeChatOptionsMenu();
    });

document.querySelector(".logout").addEventListener("click", () => {
    localStorage.removeItem("access_token");
    localStorage.removeItem("currentConversationId");
    window.location.href = "/auth_ui.html";
});

  const current = img.getAttribute("src") || "";
  const idx = candidates.indexOf(current);
  const next = idx >= 0 ? candidates[idx + 1] : candidates[0];
  if (next) img.src = next;
}
