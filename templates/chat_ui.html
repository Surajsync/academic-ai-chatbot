<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC Bijnor — Academic AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --ink:#0e1117;
  --ink2:#1a2235;
  --sidebar:#0f172a;
  --saffron:#e8820c;
  --saffron-pale:#f5a93a;
  --cream:#f7f3ea;
  --muted:#7a8599;
  --border:rgba(232,130,12,0.18);
  --border-subtle:rgba(255,255,255,0.06);
  --msg-user:linear-gradient(135deg,#e8820c,#f5a93a);
  --msg-bot:rgba(26,34,53,0.9);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  background:var(--ink);
  font-family:'Outfit',sans-serif;
  color:var(--cream);
}

/* ━━━━━━━━━ LAYOUT ━━━━━━━━━ */
.app{
  height:100vh;
  display:flex;
}

/* ━━━━━━━━━ SIDEBAR ━━━━━━━━━ */
.sidebar{
  width:270px;
  background:var(--sidebar);
  border-right:1px solid var(--border-subtle);
  display:flex;
  flex-direction:column;
  padding:22px;
}

/* Profile */
.profile{
  display:flex;
  align-items:center;
  gap:12px;
  padding-bottom:20px;
  border-bottom:1px solid var(--border-subtle);
  margin-bottom:20px;
}

.profile-icon{
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--ink2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  border:1px solid var(--border-subtle);
}

.profile-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.profile-text small{
  color:var(--muted);
  font-size:12px;
}

.profile-text h3{
  font-size:15px;
  margin-top:2px;
}

.profile-card{
  margin-top:14px;
  padding:14px;
  border-radius:16px;
  border:1px solid var(--border-subtle);
  background:linear-gradient(180deg,rgba(26,34,53,0.92),rgba(14,17,23,0.75));
  box-shadow:0 12px 30px rgba(0,0,0,0.24);
}

.profile-card-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.profile-avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  overflow:hidden;
  border:1px solid rgba(232,130,12,0.35);
  background:rgba(232,130,12,0.12);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-card-name{
  font-size:14px;
  font-weight:600;
  color:var(--cream);
}

.profile-card-sub{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
  margin-top:2px;
}

.profile-card-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.profile-card button,
.header-actions button{
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

.profile-edit-btn,
.chat-delete-btn{
  padding:10px 12px;
  background:rgba(232,130,12,0.14);
  color:var(--cream);
  border:1px solid rgba(232,130,12,0.2);
}

.chat-delete-btn{
  background:rgba(244,63,94,0.12);
  border-color:rgba(244,63,94,0.22);
}

.profile-edit-btn:hover,
.chat-delete-btn:hover{
  transform:translateY(-1px);
}

.header-actions{
  margin-left:auto;
  display:flex;
  gap:10px;
  align-items:center;
}

.header-actions button{
  padding:10px 14px;
  font-size:13px;
}

.chat-tools{
  display:flex;
  gap:10px;
  align-items:center;
  margin:10px 0 14px;
  flex-wrap:wrap;
}

.tool-search{
  flex:1;
  min-width:220px;
  background:var(--ink2);
  border:1px solid var(--border-subtle);
  color:var(--cream);
  border-radius:10px;
  height:40px;
  padding:0 12px;
}

.tool-btn{
  border:none;
  border-radius:10px;
  height:40px;
  padding:0 12px;
  cursor:pointer;
  color:var(--cream);
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border-subtle);
}

.tool-btn:hover{
  background:rgba(232,130,12,0.12);
}

.header-actions .profile-edit-btn{
  background:linear-gradient(135deg,rgba(232,130,12,0.94),rgba(245,169,58,0.94));
  color:#fff;
}

.profile-modal{
  width:min(760px,92vw);
  background:rgba(14,17,23,0.98);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
  box-shadow:0 30px 90px rgba(0,0,0,0.55);
}

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(3,7,18,0.72);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1200;
}

.profile-modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.profile-modal-header h2{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
}

.profile-form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.profile-form-grid .full-span{
  grid-column:1 / -1;
}

.profile-upload{
  display:flex;
  align-items:center;
  gap:14px;
}

.profile-preview{
  width:84px;
  height:84px;
  border-radius:50%;
  overflow:hidden;
  border:1px solid rgba(232,130,12,0.25);
  background:rgba(255,255,255,0.05);
  flex-shrink:0;
}

.profile-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-help{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.profile-form-grid input,
.profile-form-grid textarea{
  width:100%;
  background:var(--ink2);
  color:var(--cream);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  outline:none;
}

.profile-form-grid textarea{
  min-height:100px;
  resize:vertical;
}

.profile-form-grid input:focus,
.profile-form-grid textarea:focus{
  border-color:rgba(245,169,58,0.8);
  box-shadow:0 0 0 3px rgba(232,130,12,0.1);
}

.profile-modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:18px;
}

.profile-modal-footer button{
  padding:11px 16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

.profile-modal-save{
  background:linear-gradient(135deg,var(--saffron),var(--saffron-pale));
  color:#fff;
}

.profile-modal-cancel{
  background:rgba(255,255,255,0.06);
  color:var(--cream);
}

/* Buttons */
.new-chat{
  width:100%;
  padding:16px 0;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,var(--saffron),var(--saffron-pale));
  color:white;
  font-weight:600;
  font-size:15px;
  letter-spacing:0.3px;
  cursor:pointer;
  transition:all 0.25s ease;
  box-shadow:0 6px 20px rgba(232,130,12,0.25);
}

.new-chat:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(232,130,12,0.4);
}

.chat-input button{
  transition:all 0.25s ease;
}

.chat-input button:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(232,130,12,0.4);
}

.sidebar{
  width:270px;
  background:var(--sidebar);
  border-right:1px solid var(--border-subtle);
  display:flex;
  flex-direction:column;
  padding:22px;
  overflow:hidden; /* prevent full-page stretch */
}

/* bottom block */
.sidebar-bottom{
  flex:1;                 /* take remaining height */
  display:flex;
  flex-direction:column;
  padding-top:20px;
  border-top:1px solid var(--border-subtle);
  overflow:hidden;        /* important */
}

.section-title{
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:6px;
}

.logout{
  margin-top:18px;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border-subtle);
  background:none;
  color:var(--cream);
  cursor:pointer;
  transition:0.2s;
}
.logout:hover{
  background:rgba(232,130,12,0.12);
}

.item{
  padding:8px 6px;
  font-size:14px;
  cursor:pointer;
  border-radius:6px;
}

.item:hover{
  background:rgba(232,130,12,0.12);
}

.logout{
  margin-top:auto;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border-subtle);
  background:none;
  color:var(--cream);
  cursor:pointer;
}

/* ━━━━━━━━━ MAIN ━━━━━━━━━ */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:20px 30px 20px 10px; 
  min-height:0;
}
/* Header */
.header{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:0px;
}

/* Logo ring (same as auth page) */
.logo-ring{
  position:relative;
  width:90px;
  height:90px;
}
.logo-ring::before{
  content:'';
  position:absolute;
  inset:0px;
  border-radius:50%;
  border:3px solid var(--saffron);
}
.logo-ring::after{
  content:'';
  position:absolute;
  inset:3px;
  border-radius:50%;
  background:var(--ink2);
}
.logo-img{
  position:absolute;
  inset:6px;
  border-radius:50%;
  overflow:hidden;
  z-index:2;
}
.logo-img img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:white;
}

.header-text h1{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
  font-weight:700;
}

.sub-title{
  font-weight: 400;
  color:var(--saffron);
  margin-top:4px;
}

.header-text p{
  font-size:18px;
  color:var(--saffron);
  margin-top:4px;
}

/* Chat Area */
.chat-box{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:40px 20px; /* increase top padding */
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  gap:14px;
  margin-bottom:20px;
  position:relative;
}

.chat-box::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:80px;
  pointer-events:none;
  z-index:5;

  background:linear-gradient(
    to bottom,
    rgba(14,17,23,1) 0%,
    rgba(14,17,23,0.85) 40%,
    rgba(14,17,23,0) 100%
  );
}

/* Styled scrollbar for webkit browsers */
.chat-box::-webkit-scrollbar{
  width:8px;
}

.chat-box::-webkit-scrollbar-track{
  background:rgba(255,255,255,0.04);
}

.chat-box::-webkit-scrollbar-thumb{
  background:rgba(232,130,12,0.4);
  border-radius:4px;
  transition:all 0.2s ease;
}

.chat-box::-webkit-scrollbar-thumb:hover{
  background:rgba(232,130,12,0.7);
}

.message{
  max-width:65%;
  padding:12px 16px;
  border-radius:14px;
  font-size:14px;
  border:1px solid var(--border-subtle);
  line-height:1.5;
  word-wrap:break-word;
  white-space:pre-wrap;
  
  opacity:0;
  transform:translateY(10px) scale(0.98);
  animation:smoothAppear 0.35s ease forwards;
}

.message.search-hit{
  box-shadow:0 0 0 2px rgba(245,169,58,0.45);
}

.message-row{
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.message-row.user-row{
  justify-content:flex-end;
}

.message-row.bot-row{
  justify-content:flex-start;
}

.msg-select{
  margin-top:10px;
  width:16px;
  height:16px;
  accent-color:var(--saffron);
  cursor:pointer;
}

@keyframes smoothAppear{
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.bot{
  background:var(--msg-bot);
  align-self:flex-start;
}

.user{
  background:var(--msg-user);
  align-self:flex-end;
  color:white;
}

/* Input */
.chat-input{
  display:flex;
  gap:12px;
}

.chat-input input{
  flex:1;
  height:50px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--ink2);
  padding:0 16px;
  color:white;
}

.chat-input button{
  width:120px;
  border-radius:12px;
  border:none;
  background:linear-gradient(135deg,var(--saffron),var(--saffron-pale));
  color:white;
  font-weight:500;
  cursor:pointer;
}
/* ━━━━━━━━━ CONVERSATION ITEM━━━━━━━━━ */
.conversation-item{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 8px;
  border-radius:6px;
  cursor:pointer;
}

.conversation-item:hover{
  background:rgba(232,130,12,0.12);
}

.menu-btn{
  opacity:0;
  cursor:pointer;
  padding:4px 6px;
  border-radius:4px;
}

.conversation-item:hover .menu-btn{
  opacity:1;
}

#conversation-list{
  flex:1;
  overflow-y:auto;
  margin-top:10px;
  padding-right:4px;
}

/* Optional: clean scrollbar styling */
#conversation-list::-webkit-scrollbar{
  width:6px;
}

#conversation-list::-webkit-scrollbar-thumb{
  background:rgba(232,130,12,0.4);
  border-radius:6px;
}

.dropdown{
  position:absolute;
  right:5px;
  top:28px;
  background:#1a2235;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:8px;
  padding:6px 0;
  display:none;
  flex-direction:column;
  z-index:100;
  min-width:140px;
}

.dropdown div{
  padding:8px 12px;
  font-size:13px;
  cursor:pointer;
}

.dropdown div:hover{
  background:rgba(232,130,12,0.15);
}

.hero-welcome {
  margin:auto;
  max-width:720px;
  text-align:center;
  font-size:28px;
  font-weight:600;
  line-height:1.6;
  padding:50px 40px;
  border-radius:20px;
  color:var(--cream);

  background:linear-gradient(
      135deg,
      rgba(232,130,12,0.15),
      rgba(255,255,255,0.03)
  );

  border:1px solid var(--border);
  box-shadow:0 10px 40px rgba(0,0,0,0.4);

  animation:fadeInHero 0.5s ease forwards;
}

@keyframes fadeInHero {
  from {
      opacity:0;
      transform:translateY(20px);
  }
  to {
      opacity:1;
      transform:translateY(0);
  }
}


</style>
</head>
<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">

  <!-- TOP -->
  <div>
    <div class="profile">
      <div class="profile-icon" id="sidebar-profile-icon">👤</div>
      <div class="profile-text">
        <small id="greet-text">Good Evening</small>
        <h3 id="sidebar-username">User</h3>
      </div>
    </div>

    <div class="profile-card">
      <div class="profile-card-top">
        <div class="profile-avatar" id="profile-avatar-slot">👤</div>
        <div>
          <div class="profile-card-name" id="profile-card-name">Your profile</div>
          <div class="profile-card-sub" id="profile-card-subtitle">Add a photo, department, phone, and more.</div>
        </div>
      </div>
      <div class="profile-card-actions">
        <button class="profile-edit-btn" id="edit-profile-btn" type="button">Edit Profile</button>
      </div>
    </div>

    <button class="new-chat">+ New Chat</button>
  </div>

  <!-- BOTTOM AREA -->
  <div class="sidebar-bottom">
    <div id="conversation-list"></div>
    <button class="logout">Logout</button>
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <div class="header">
    <div class="logo-ring">
      <div class="logo-img">
        <img src="/static/Images/logo.png" alt="REC Bijnor" onerror="handleLogoError(this)">
      </div>
    </div>

    <div class="header-text">
      <h1>Rajkiya Engineering College, Bijnor</h1>
      <p class="sub-title">Academic AI</p>
    </div>

    <div class="header-actions">
      <button class="chat-delete-btn" id="delete-selected-messages-btn" type="button">Delete Selected Messages</button>
    </div>
  </div>

  <div class="chat-tools">
    <input id="chat-search-input" class="tool-search" type="text" placeholder="Search in this chat...">
    <button id="select-all-messages-btn" class="tool-btn" type="button">Select All</button>
    <button id="clear-chat-messages-btn" class="tool-btn" type="button">Clear Chat</button>
    <button id="export-chat-btn" class="tool-btn" type="button">Export Chat</button>
  </div>

  <div class="chat-box" id="chat-box"></div>

  <div class="chat-input">
    <input type="text" id="user-input" placeholder="Type your message...">
    <button id="send-btn">Send</button>
  </div>

</div>
</div>

<script>

// ================= USERNAME + GREETING =================
const username = localStorage.getItem("username");
if (username) {
    document.getElementById("sidebar-username").innerText = username;

    const hour = new Date().getHours();
    let greet = "Good Evening";
    if (hour < 12) greet = "Good Morning";
    else if (hour < 17) greet = "Good Afternoon";

    document.getElementById("greet-text").innerText = greet;
}

// ================= AUTH CHECK =================
const tokenCheck = localStorage.getItem("access_token");
if (!tokenCheck) {
    window.location.href = "/auth_ui.html";
}

const roleCheck = (localStorage.getItem("role") || "").trim().toLowerCase();
if (roleCheck === "admin") {
  window.location.href = "/admin_ui.html";
}

// ================= DOM REFERENCES =================
const chatBox = document.getElementById("chat-box");
const input = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const conversationList = document.getElementById("conversation-list");
const editProfileBtn = document.getElementById("edit-profile-btn");
const deleteSelectedMessagesBtn = document.getElementById("delete-selected-messages-btn");
const chatSearchInput = document.getElementById("chat-search-input");
const selectAllMessagesBtn = document.getElementById("select-all-messages-btn");
const clearChatMessagesBtn = document.getElementById("clear-chat-messages-btn");
const exportChatBtn = document.getElementById("export-chat-btn");
const profileAvatarSlot = document.getElementById("profile-avatar-slot");
const profileCardName = document.getElementById("profile-card-name");
const profileCardSubtitle = document.getElementById("profile-card-subtitle");
const sidebarProfileIcon = document.getElementById("sidebar-profile-icon");
const API_BASE = window.location.origin;

async function enforceChatAccess() {
  const token = localStorage.getItem("access_token");
  if (!token) {
    window.location.href = "/auth_ui.html";
    return;
  }

  try {
    const meRes = await fetch(`${API_BASE}/auth/me`, {
      headers: { "Authorization": `Bearer ${token}` }
    });

    if (!meRes.ok) {
      localStorage.removeItem("access_token");
      localStorage.removeItem("role");
      window.location.href = "/auth_ui.html";
      return;
    }

    const me = await meRes.json();
    const role = (me.role || "").toString().trim().toLowerCase();
    localStorage.setItem("role", role || "user");
    if (role === "admin") {
      window.location.href = "/admin_ui.html";
    }
  } catch {
    // If role verification fails due transient network errors, keep current page.
  }
}

enforceChatAccess();
loadUserProfile();

editProfileBtn?.addEventListener("click", openProfileModal);
deleteSelectedMessagesBtn?.addEventListener("click", deleteSelectedMessages);
chatSearchInput?.addEventListener("input", () => {
  loadConversation(state.currentConversationId, { preserveSelection: true });
});
selectAllMessagesBtn?.addEventListener("click", selectAllMessagesInCurrentChat);
clearChatMessagesBtn?.addEventListener("click", clearCurrentChatMessages);
exportChatBtn?.addEventListener("click", exportCurrentChat);

// ================= LOAD CONVERSATIONS FROM BACKEND =================
async function loadConversationsFromBackend() {
    try {
        const token = localStorage.getItem("access_token");
        const response = await fetch(`${API_BASE}/chat/history`, {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            const conversations = await response.json();
            // Convert backend format to frontend format
            const formattedConvs = conversations.map(conv => ({
              id: normalizeConversationId(conv.id),
                title: conv.title,
            messages: (Array.isArray(conv.messages) ? conv.messages : []).map(msg => ({
              id: normalizeMessageId(msg.id),
              role: msg.role === "user" ? "user" : "bot",
              text: msg.text || msg.content || ""
            })),
                pinned: false,
                archived: false
            }));
            
            // Update state with conversations from backend
            state.conversations = formattedConvs;
            localStorage.setItem("conversations", JSON.stringify(state.conversations));
            renderConversations();
        }
    } catch (error) {
        console.error("Error loading conversations:", error);
    }
}

// ================= WELCOME PROMPTS =================
const welcomePrompts = [
    "Welcome! 🌍 Which country currently holds the presidency of the G20?",
    "Hello! 🌎 Which country has the largest population today?",
    "Good day! 📚 How many continents are there on Earth?",

const state = {
    conversations: JSON.parse(localStorage.getItem("conversations")) || [],
    currentConversationId: localStorage.getItem("currentConversationId"),
  archivedExpanded: false,
  profile: null,
  selectedMessageIds: new Set(),
  activeRenderedConversationId: null
};

function normalizeConversationId(id) {
  if (id === null || id === undefined) return null;
  return String(id);
}

function isTemporaryConversationId(id) {
  return normalizeConversationId(id)?.startsWith("tmp-");
}

function findConversation(id) {
  const targetId = normalizeConversationId(id);
  return state.conversations.find(c => normalizeConversationId(c.id) === targetId);
}

function normalizeMessageId(id) {
  if (id === null || id === undefined || id === "") return null;
  return String(id);
}

function createLocalMessageId() {
  return `local-${Date.now()}-${Math.floor(Math.random() * 100000)}`;
}

function getMessageId(msg, idx = 0) {
  return normalizeMessageId(msg?.id) || `legacy-${idx}-${Math.floor(Math.random() * 100000)}`;
}

state.conversations = state.conversations.map(conv => ({
  ...conv,
  id: normalizeConversationId(conv.id),
  messages: (conv.messages || []).map((msg, idx) => ({
    id: getMessageId(msg, idx),
    role: msg.role === "user" ? "user" : "bot",
    text: msg.text || msg.content || ""
  }))
}));
state.currentConversationId = normalizeConversationId(state.currentConversationId);

function updateState(newState = {}) {
    Object.assign(state, newState);
  state.conversations = state.conversations.map(conv => ({
    ...conv,
    id: normalizeConversationId(conv.id),
    messages: (conv.messages || []).map((msg, idx) => ({
      id: getMessageId(msg, idx),
      role: msg.role === "user" ? "user" : "bot",
      text: msg.text || msg.content || ""
    }))
  }));
  state.currentConversationId = normalizeConversationId(state.currentConversationId);
    localStorage.setItem("conversations", JSON.stringify(state.conversations));
    localStorage.setItem("currentConversationId", state.currentConversationId);
    renderConversations();
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getProfileLabel(profile) {
  const displayName = (profile?.display_name || profile?.username || username || "User").trim();
  const sections = [profile?.department, profile?.semester, profile?.year].filter(Boolean);
  return {
    name: displayName,
    subtitle: sections.length ? sections.join(" · ") : "Add a photo, department, phone, and more.",
  };
}

function getProfileInitials(nameValue) {
  const parts = String(nameValue || "U").trim().split(/\s+/).filter(Boolean).slice(0, 2);
  return parts.map(part => part[0]?.toUpperCase() || "U").join("") || "U";
}

function renderProfileSection(profile) {
  state.profile = profile || null;
  const info = getProfileLabel(profile);
  const photoData = profile?.photo_data || "";
  const initials = getProfileInitials(info.name);
  const avatarMarkup = photoData
    ? `<img src="${photoData}" alt="Profile photo">`
    : `<span>${initials}</span>`;

  if (profileAvatarSlot) profileAvatarSlot.innerHTML = avatarMarkup;
  if (sidebarProfileIcon) sidebarProfileIcon.innerHTML = photoData ? `<img src="${photoData}" alt="Profile photo">` : initials;
  if (profileCardName) profileCardName.textContent = info.name;
  if (profileCardSubtitle) profileCardSubtitle.textContent = info.subtitle;
}

async function deleteConversationById(id) {
  const conversationId = normalizeConversationId(id);
  if (!conversationId) return;

  const conv = findConversation(conversationId);
  const label = conv?.title || "this chat";
  const confirmDelete = confirm(`Delete ${label}? This cannot be undone.`);
  if (!confirmDelete) return;

  try {
    if (!isTemporaryConversationId(conversationId)) {
      const token = localStorage.getItem("access_token");
      const response = await fetch(`${API_BASE}/chat/conversations/${conversationId}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || "Could not delete chat");
      }
    }

    const deletingCurrent = normalizeConversationId(state.currentConversationId) === conversationId;
    const remainingConversations = state.conversations.filter(c => normalizeConversationId(c.id) !== conversationId);
    const nextConversation = deletingCurrent ? remainingConversations.find(c => !c.archived) || null : findConversation(state.currentConversationId);

    updateState({
      conversations: remainingConversations,
      currentConversationId: nextConversation ? nextConversation.id : null
    });

    if (deletingCurrent) {
      if (nextConversation) {
        loadConversation(nextConversation.id);
      } else {
        createNewConversation();
        showWelcomePrompt();
      }
    }
  } catch (error) {
    alert(error.message || "Could not delete chat");
  }
}

function clearSelectedMessages() {
  state.selectedMessageIds = new Set();
}

function getCurrentSearchQuery() {
  return String(chatSearchInput?.value || "").trim().toLowerCase();
}

function toggleMessageSelection(messageId, isSelected) {
  const normalizedId = normalizeMessageId(messageId);
  if (!normalizedId) return;

  if (isSelected) {
    state.selectedMessageIds.add(normalizedId);
  } else {
    state.selectedMessageIds.delete(normalizedId);
  }
}

async function deleteSelectedMessages() {
  const conv = findConversation(state.currentConversationId);
  if (!conv) return;

  const selectedIds = Array.from(state.selectedMessageIds);
  if (!selectedIds.length) {
    alert("Select one or more messages to delete.");
    return;
  }

  const confirmed = confirm(`Delete ${selectedIds.length} selected message(s) from this chat?`);
  if (!confirmed) return;

  const persistedMessageIds = selectedIds
    .map(id => Number(id))
    .filter(Number.isInteger);

  try {
    const conversationId = normalizeConversationId(state.currentConversationId);
    const isPersistedConversation = conversationId && !isTemporaryConversationId(conversationId);

    if (isPersistedConversation && persistedMessageIds.length > 0) {
      const token = localStorage.getItem("access_token");
      const response = await fetch(`${API_BASE}/chat/conversations/${conversationId}/messages`, {
        method: "DELETE",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ message_ids: persistedMessageIds })
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || "Could not delete selected messages");
      }
    }

    conv.messages = conv.messages.filter(msg => {
      const msgId = normalizeMessageId(msg.id);
      return !state.selectedMessageIds.has(msgId);
    });

    clearSelectedMessages();
    updateState();
    loadConversation(state.currentConversationId);
  } catch (error) {
    alert(error.message || "Could not delete selected messages");
  }
}

function selectAllMessagesInCurrentChat() {
  const conv = findConversation(state.currentConversationId);
  if (!conv || !Array.isArray(conv.messages) || !conv.messages.length) {
    alert("No messages available to select.");
    return;
  }

  clearSelectedMessages();
  conv.messages.forEach((msg, idx) => {
    const mid = getMessageId(msg, idx);
    state.selectedMessageIds.add(mid);
  });

  document.querySelectorAll(".msg-select").forEach(box => {
    box.checked = true;
  });
}

async function clearCurrentChatMessages() {
  const conv = findConversation(state.currentConversationId);
  if (!conv) return;
  if (!Array.isArray(conv.messages) || conv.messages.length === 0) {
    alert("This chat is already empty.");
    return;
  }

  const confirmed = confirm("Clear all messages in this chat? This cannot be undone.");
  if (!confirmed) return;

  const allMessageIds = conv.messages
    .map(msg => Number(normalizeMessageId(msg.id)))
    .filter(Number.isInteger);

  try {
    const conversationId = normalizeConversationId(state.currentConversationId);
    const isPersistedConversation = conversationId && !isTemporaryConversationId(conversationId);

    if (isPersistedConversation && allMessageIds.length > 0) {
      const token = localStorage.getItem("access_token");
      const response = await fetch(`${API_BASE}/chat/conversations/${conversationId}/messages`, {
        method: "DELETE",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ message_ids: allMessageIds })
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || "Could not clear this chat");
      }
    }

    conv.messages = [];
    clearSelectedMessages();
    updateState();
    loadConversation(state.currentConversationId);
  } catch (error) {
    alert(error.message || "Could not clear this chat");
  }
}

function exportCurrentChat() {
  const conv = findConversation(state.currentConversationId);
  if (!conv || !Array.isArray(conv.messages) || conv.messages.length === 0) {
    alert("No messages available to export.");
    return;
  }

  const lines = [
    `Chat: ${conv.title || "Untitled Chat"}`,
    `Exported at: ${new Date().toLocaleString("en-IN")}`,
    ""
  ];

  conv.messages.forEach(msg => {
    const role = msg.role === "user" ? "User" : "Bot";
    lines.push(`${role}: ${msg.text || msg.content || ""}`);
  });

  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `chat-${normalizeConversationId(conv.id) || Date.now()}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function createNewConversation() {

  clearSelectedMessages();

    // Remove previous empty conversation if exists
    if (state.currentConversationId) {
        const existing = state.conversations.find(
            c => c.id === state.currentConversationId
        );

        if (existing && existing.messages.length === 0) {
            state.conversations = state.conversations.filter(
                c => c.id !== existing.id
            );
        }
    }

    const id = `tmp-${Date.now()}`;

    const newConv = {
        id,
        title: "New Chat",
        messages: [],
        pinned: false,
        archived: false
    };

    updateState({
        conversations: [newConv, ...state.conversations],
        currentConversationId: id
    });

    loadConversation(id);
}

function renderConversations() {

    conversationList.innerHTML = "";

    const pastConversations = state.conversations
        .filter(c => !c.archived)
        .sort((a, b) => {
            if (a.pinned === b.pinned) return 0;
            return a.pinned ? -1 : 1;
        });

    const archived = state.conversations.filter(c => c.archived);

    // Past Conversations
    if (pastConversations.length > 0) {
        const sectionTitle = document.createElement("div");
        sectionTitle.className = "section-title";
        sectionTitle.innerText = "Past Conversations";
        conversationList.appendChild(sectionTitle);

        pastConversations.forEach(conv => {
            createConversationItem(conv);
        });
    }

    // Archived (Collapsible)
    if (archived.length > 0) {

        const archivedHeader = document.createElement("div");
        archivedHeader.className = "section-title";
        archivedHeader.style.marginTop = "25px";
        archivedHeader.style.cursor = "pointer";
        archivedHeader.innerText =
            (state.archivedExpanded ? "▼ " : "▶ ") +
            `Archived (${archived.length})`;

        archivedHeader.onclick = () => {
            state.archivedExpanded = !state.archivedExpanded;
            renderConversations();
        };

        conversationList.appendChild(archivedHeader);

        if (state.archivedExpanded) {
            archived.forEach(conv => {
                createConversationItem(conv);
            });
        }
    }
}

// ================= LOAD CHAT =================
function loadConversation(id, options = {}) {
  const { preserveSelection = false } = options;

  const conv = findConversation(id);
    if (!conv) return;

    const incomingId = normalizeConversationId(id);
    if (!preserveSelection && incomingId !== state.activeRenderedConversationId) {
      clearSelectedMessages();
    }
    state.activeRenderedConversationId = incomingId;

    chatBox.innerHTML = "";

    if (!Array.isArray(conv.messages) || conv.messages.length === 0) {
        showWelcomePrompt();
        return;
    }

    conv.messages.forEach((msg, idx) => {
      const role = msg.role === "user" ? "user" : "bot";
      const safeText = msg.text || msg.content || "";
      const messageId = getMessageId(msg, idx);
      const searchQuery = getCurrentSearchQuery();
      const isSearchHit = searchQuery && safeText.toLowerCase().includes(searchQuery);
      msg.id = messageId;

      const row = document.createElement("div");
      row.className = `message-row ${role}-row`;

      const selectBox = document.createElement("input");
      selectBox.type = "checkbox";
      selectBox.className = "msg-select";
      selectBox.checked = state.selectedMessageIds.has(messageId);
      selectBox.addEventListener("change", () => {
        toggleMessageSelection(messageId, selectBox.checked);
      });

      const bubble = document.createElement("div");
      bubble.className = "message " + role;
      if (isSearchHit) bubble.classList.add("search-hit");

      if (role === "bot") {
        bubble.innerHTML = safeText
          .replace(/\n/g, '<br>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/__(.*?)__/g, '<em>$1</em>');
      } else {
        bubble.textContent = safeText;
      }

      if (role === "user") {
        row.appendChild(selectBox);
        row.appendChild(bubble);
      } else {
        row.appendChild(bubble);
        row.appendChild(selectBox);
      }

      chatBox.appendChild(row);
    });

    chatBox.scrollTop = chatBox.scrollHeight;
}

// ================= SAVE MESSAGE =================
function saveMessage(role, text, messageId = null) {

  const conv = findConversation(state.currentConversationId);

    if (!conv) return;

    conv.messages.push({
      id: normalizeMessageId(messageId) || createLocalMessageId(),
      role,
      text
    });

    if (conv.title === "New Chat") {
        conv.title = text.substring(0, 25);
    }

    updateState();
}

// ================= SEND MESSAGE =================
async function sendMessage() {

    const msg = input.value.trim();
    if (!msg) return;

    if (chatBox.querySelector(".hero-welcome")) {
        chatBox.innerHTML = "";
    }

    if (!state.currentConversationId) {
        createNewConversation();
    }

    const userMessageId = createLocalMessageId();

    saveMessage("user", msg, userMessageId);
    loadConversation(state.currentConversationId);

    input.value = "";
    chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: "smooth" });

    const token = localStorage.getItem("access_token");
    if (!token) {
        alert("Session expired. Please login again.");
        window.location.href = "/auth_ui.html";
        return;
    }

    try {
      const activeConversationId = normalizeConversationId(state.currentConversationId);
      const conversationIdForApi = activeConversationId && !isTemporaryConversationId(activeConversationId)
        ? Number(activeConversationId)
        : null;

        const response = await fetch(`${API_BASE}/chat`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
        body: JSON.stringify({
          message: msg,
          conversation_id: conversationIdForApi
        })
        });

        if (!response.ok) return;

        const data = await response.json();

      if (data.conversation_id) {
        const serverConversationId = normalizeConversationId(data.conversation_id);

        if (activeConversationId && isTemporaryConversationId(activeConversationId)) {
          const localConversation = findConversation(activeConversationId);
          if (localConversation) {
            localConversation.id = serverConversationId;
          }
          state.currentConversationId = serverConversationId;
          updateState();
        } else if (serverConversationId && state.currentConversationId !== serverConversationId) {
          state.currentConversationId = serverConversationId;
          updateState();
        }
      }

        const activeConv = findConversation(state.currentConversationId);
        if (activeConv) {
          const lastUserMessage = [...activeConv.messages].reverse().find(m => m.role === "user");
          if (lastUserMessage && data.user_message_id) {
            lastUserMessage.id = normalizeMessageId(data.user_message_id);
          }
        }

        saveMessage("bot", data.reply, data.bot_message_id);
        loadConversation(state.currentConversationId);

        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: "smooth" });

    } catch (error) {
        console.error("Fetch error:", error);
    }
}

// ================= CONVERSATION ACTIONS =================
function shareConversation(id) {
  const conv = findConversation(id);
    if (!conv) return;

    const text = conv.messages
        .map(m => `${m.role.toUpperCase()}: ${m.text}`)
        .join("\n");

    navigator.clipboard.writeText(text);
    alert("Conversation copied to clipboard");
}

function renameConversation(id) {
  const conv = findConversation(id);
    if (!conv) return;

    const newTitle = prompt("Enter new name:", conv.title);
    if (!newTitle) return;

    conv.title = newTitle.trim();
    updateState();
}

function togglePin(id) {
  const conv = findConversation(id);
    if (!conv) return;

    conv.pinned = !conv.pinned;
    updateState();
}

function archiveConversation(id) {
  const conv = findConversation(id);
    if (!conv) return;

    conv.archived = true;
    conv.pinned = false;

    const wasCurrent = normalizeConversationId(state.currentConversationId) === normalizeConversationId(id);
    updateState();

    if (wasCurrent) {
        const next = state.conversations.find(c => !c.archived);
        if (next) {
            updateState({ currentConversationId: next.id });
            loadConversation(next.id);
        } else {
            state.currentConversationId = null;
            createNewConversation();
            showWelcomePrompt();
        }
    }
}

function restoreConversation(id) {
  const conv = findConversation(id);
    if (!conv) return;

    conv.archived = false;
    updateState();
}

function deleteConversation(id) {
  deleteConversationById(id);
}

function closeDropdowns() {
    document.querySelectorAll(".dropdown")
        .forEach(d => d.style.display = "none");
}

document.addEventListener("click", closeDropdowns);

conversationList.addEventListener("click", function (e) {

    const action = e.target.dataset.action;
    const id = e.target.dataset.id;

    if (!action || !id) return;

    switch (action) {
        case "share": shareConversation(id); break;
        case "rename": renameConversation(id); break;
        case "toggle-pin": togglePin(id); break;
        case "archive": archiveConversation(id); break;
        case "restore": restoreConversation(id); break;
        case "delete": deleteConversation(id); break;
    }

    closeDropdowns();
});

// ================= EVENTS =================
sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
});

document.querySelector(".new-chat")
    .addEventListener("click", () => {
        createNewConversation();
        showWelcomePrompt();
    });

document.querySelector(".logout").addEventListener("click", () => {
    localStorage.removeItem("access_token");
    localStorage.removeItem("currentConversationId");
    window.location.href = "/auth_ui.html";
});

// ================= INITIAL LOAD =================
// Load conversations from backend first
loadConversationsFromBackend().then(() => {
  if (!state.currentConversationId || !findConversation(state.currentConversationId)) {
        createNewConversation();
        showWelcomePrompt();
    } else {
        renderConversations();
        loadConversation(state.currentConversationId);
    }
});

function handleLogoError(img){
  const candidates = ["/static/Images/logo.png", "/logo.png", "static/Images/logo.png", "../static/Images/logo.png"];
  const current = img.getAttribute("src") || "";
  const idx = candidates.indexOf(current);
  const next = idx >= 0 ? candidates[idx + 1] : candidates[0];
  if (next) img.src = next;
}
