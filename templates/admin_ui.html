<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC Bijnor — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg:#080c14;--bg2:#0d1424;--bg3:#111827;--sidebar:#090e1a;
  --card:#0f1829;--card2:#141f33;
  --saffron:#f0900d;--saf2:#fbb040;--saf-glow:rgba(240,144,13,0.12);--saf-dim:rgba(240,144,13,0.07);
  --teal:#14b8a6;--cream:#eef2f7;--cream2:#c8d0de;--muted:#5a6a82;--muted2:#3d4f68;
  --border:rgba(240,144,13,0.15);--border2:rgba(255,255,255,0.05);
  --red:#f43f5e;--green:#10d9a0;--yellow:#fbbf24;--blue:#60a5fa;
  --shadow:0 8px 32px rgba(0,0,0,0.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--cream);display:flex}

.sidebar{width:230px;min-width:230px;background:var(--sidebar);border-right:1px solid var(--border2);display:flex;flex-direction:column;position:relative;z-index:10}
.sidebar::after{content:'';position:absolute;right:0;top:20%;bottom:20%;width:1px;background:linear-gradient(to bottom,transparent,var(--saffron),transparent);opacity:0.3}
.sidebar-logo{padding:22px 20px 18px;border-bottom:1px solid var(--border2)}
.sidebar-logo img{width:36px;height:36px;border-radius:50%;object-fit:contain;background:white;border:2px solid var(--saffron);margin-bottom:10px;display:block}
.brand{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:var(--saffron);line-height:1.2}
.sub-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2.5px;color:var(--muted);margin-top:5px;text-transform:uppercase}
.nav-group-label{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted2);padding:18px 20px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;margin:1px 10px;border-radius:8px;cursor:pointer;border:none;background:none;width:calc(100% - 20px);color:var(--muted);font-family:'Sora';font-size:13px;font-weight:500;text-align:left;transition:all 0.18s}
.nav-item:hover{background:var(--saf-dim);color:var(--cream2)}
.nav-item.active{background:var(--saf-glow);color:var(--saffron);box-shadow:inset 3px 0 0 var(--saffron)}
.nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;background:rgba(244,63,94,0.2);color:var(--red);font-size:10px;padding:1px 6px;border-radius:20px;font-weight:600}
.sidebar-footer{margin-top:auto;padding:14px 12px;border-top:1px solid var(--border2)}
.admin-card{background:var(--saf-glow);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.admin-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--saffron),var(--saf2));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.admin-card .info{flex:1;min-width:0}
.admin-card .aname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-card .arole{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--saffron);letter-spacing:1px;margin-top:2px}
.logout-btn{width:100%;padding:9px;border-radius:8px;border:1px solid var(--border2);background:none;color:var(--muted);font-family:'Sora';font-size:12px;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;justify-content:center;gap:6px}
.logout-btn:hover{border-color:var(--red);color:var(--red);background:rgba(244,63,94,0.06)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:58px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border2);flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-title{font-size:16px;font-weight:600}
.breadcrumb{font-size:11px;color:var(--muted)}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-btn{padding:7px 11px;border-radius:8px;border:1px solid var(--border2);background:rgba(255,255,255,0.04);color:var(--cream2);font-family:'Sora';font-size:11px;cursor:pointer;transition:all 0.18s}
.topbar-btn:hover{border-color:var(--border);background:var(--saf-dim);color:var(--cream)}
.sys-status{display:flex;align-items:center;gap:6px;background:rgba(16,217,160,0.08);border:1px solid rgba(16,217,160,0.2);padding:5px 12px;border-radius:20px;font-size:11px;color:var(--green)}
.sys-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.time-display{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.content{padding:20px 24px;overflow-y:auto;flex:1}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:5px}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:18px;position:relative;overflow:hidden;cursor:pointer;transition:all 0.22s}
.stat-card:hover{border-color:var(--border);transform:translateY(-2px);box-shadow:var(--shadow)}
.bar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0}
.c1 .bar,.bar.c1{background:linear-gradient(90deg,var(--saffron),var(--saf2))}
.c2 .bar,.bar.c2{background:linear-gradient(90deg,var(--green),var(--teal))}
.c3 .bar,.bar.c3{background:linear-gradient(90deg,var(--blue),#818cf8)}
.c4 .bar,.bar.c4{background:linear-gradient(90deg,var(--red),#fb7185)}
.stat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;font-weight:500}
.stat-icon{font-size:20px;opacity:0.5}
.stat-value{font-size:36px;font-weight:700;line-height:1}
.stat-sub{font-size:11px;color:var(--muted);margin-top:6px}

.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-hdr h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.count{font-size:12px;color:var(--muted);font-weight:400}
.viewer-role-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--border2);background:rgba(255,255,255,0.04);color:var(--cream2);white-space:nowrap;max-width:max-content;margin-left:auto}
.viewer-role-chip.main{border-color:rgba(251,191,36,0.35);background:rgba(251,191,36,0.12);color:var(--yellow)}

.btn{padding:8px 16px;border-radius:8px;border:none;font-family:'Sora';font-size:12px;font-weight:500;cursor:pointer;transition:all 0.18s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--saffron);color:#fff}
.btn-primary:hover{background:var(--saf2);box-shadow:0 4px 16px rgba(240,144,13,0.35)}
.btn-success{background:rgba(16,217,160,0.12);color:var(--green);border:1px solid rgba(16,217,160,0.2)}
.btn-success:hover{background:rgba(16,217,160,0.2)}
.btn-danger{background:rgba(244,63,94,0.1);color:var(--red);border:1px solid rgba(244,63,94,0.2)}
.btn-danger:hover{background:rgba(244,63,94,0.2)}
.btn-ghost{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border2)}
.btn-ghost:hover{color:var(--cream2);background:rgba(255,255,255,0.07)}
.btn-blue{background:rgba(96,165,250,0.1);color:var(--blue);border:1px solid rgba(96,165,250,0.2)}
.btn-sm{padding:5px 10px;font-size:11px}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;transition:border-color 0.18s}
.search-wrap:focus-within{border-color:var(--border)}
.search-wrap input{background:none;border:none;outline:none;color:var(--cream);font-family:'Sora';font-size:13px;flex:1}
.search-wrap input::placeholder{color:var(--muted)}
.filter-select{background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;color:var(--cream2);font-family:'Sora';font-size:12px;outline:none;cursor:pointer}
.filter-select:focus{border-color:var(--border)}

.table-wrap{background:var(--card);border:1px solid var(--border2);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{padding:11px 16px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;background:var(--card2);border-bottom:1px solid var(--border2);text-align:left;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--border2);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.015)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.badge::before{content:'●';font-size:7px}
.badge-green{background:rgba(16,217,160,0.1);color:var(--green)}
.badge-red{background:rgba(244,63,94,0.1);color:var(--red)}
.badge-yellow{background:rgba(251,191,36,0.1);color:var(--yellow)}
.badge-blue{background:rgba(96,165,250,0.1);color:var(--blue)}
.badge-orange{background:rgba(240,144,13,0.1);color:var(--saffron)}
.chips{display:flex;flex-wrap:wrap;gap:4px;max-width:260px}
.chip{background:var(--saf-dim);border:1px solid rgba(240,144,13,0.2);color:var(--saffron);padding:2px 7px;border-radius:20px;font-size:10px;font-family:'JetBrains Mono',monospace}
.truncate{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.action-group{display:flex;gap:5px;align-items:center}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn 0.15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg3);border:1px solid var(--border);border-radius:18px;padding:28px;width:540px;max-width:94vw;max-height:90vh;overflow-y:auto;animation:popUp 0.22s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 24px 80px rgba(0,0,0,0.6)}
@keyframes popUp{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.modal-header h2{font-size:16px;font-weight:600}
.modal-close{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.06);border:none;color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.modal-close:hover{background:rgba(244,63,94,0.15);color:var(--red)}
.field{margin-bottom:16px}
.field label{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-weight:600}
.field input,.field textarea,.field select{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border2);border-radius:9px;padding:10px 13px;color:var(--cream);font-family:'Sora';font-size:13px;outline:none;transition:all 0.18s;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--saffron);background:var(--saf-dim);box-shadow:0 0 0 3px rgba(240,144,13,0.1)}
.field textarea{min-height:100px}
.field .hint{font-size:11px;color:var(--muted);margin-top:5px}
.char-count{font-size:10px;color:var(--muted);float:right;margin-top:4px;font-family:'JetBrains Mono',monospace}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border2)}

.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty-icon{font-size:42px;margin-bottom:14px;opacity:0.6}
.empty h3{font-size:15px;font-weight:600;color:var(--cream2);margin-bottom:6px}
.empty p{font-size:13px;line-height:1.6;max-width:300px;margin:0 auto}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:12px 16px;font-size:13px;display:flex;align-items:center;gap:10px;min-width:260px;box-shadow:var(--shadow);animation:slideIn 0.3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes slideIn{from{transform:translateX(120px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.out{animation:slideOut 0.3s ease forwards}
@keyframes slideOut{to{transform:translateX(120px);opacity:0}}
.toast-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.toast.success .toast-icon{background:rgba(16,217,160,0.15)}
.toast.error .toast-icon{background:rgba(244,63,94,0.15)}
.toast.info .toast-icon{background:rgba(96,165,250,0.15)}
.toast-msg{flex:1;font-size:13px}
.toast-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0;line-height:1}

.dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.panel{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:20px}
.panel-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:16px}
.status-lines{display:grid;gap:8px}
.status-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid var(--border2);border-radius:10px;background:rgba(255,255,255,0.02)}
.status-key{font-size:12px;color:var(--cream2)}
.status-val{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.quick-action{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:rgba(255,255,255,0.025);border:1px solid var(--border2);cursor:pointer;transition:all 0.18s;margin-bottom:8px;text-align:left;width:100%}
.quick-action:hover{background:var(--saf-dim);border-color:var(--border);transform:translateX(4px)}
.qa-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.qa-title{font-size:13px;font-weight:500}
.qa-desc{font-size:11px;color:var(--muted);margin-top:2px}

.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.progress-label{font-size:12px;color:var(--cream2);min-width:130px}
.progress-track{flex:1;height:6px;background:var(--border2);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:6px;transition:width 0.6s ease}
.progress-value{font-size:11px;color:var(--muted);min-width:32px;text-align:right;font-family:'JetBrains Mono',monospace}

.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border2)}
.page-info{font-size:12px;color:var(--muted)}
.page-btns{display:flex;gap:4px}
.page-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border2);background:none;color:var(--muted);cursor:pointer;font-size:12px;transition:all 0.15s;display:flex;align-items:center;justify-content:center}
.page-btn:hover{border-color:var(--border);color:var(--cream2)}
.page-btn.active{background:var(--saffron);border-color:var(--saffron);color:#fff}

.users-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.user-card{background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:16px;transition:all 0.2s}
.user-card:hover{border-color:var(--border);box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.user-card-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.user-card-top.clickable{cursor:pointer}
.user-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.user-name-line{display:flex;align-items:center;gap:8px}
.user-card-name{font-size:13px;font-weight:600}
.user-card-email{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.name-badge-main{font-size:9px;letter-spacing:.8px;padding:2px 7px;border-radius:999px;border:1px solid rgba(251,191,36,0.28);background:rgba(251,191,36,0.12);color:var(--yellow);font-weight:700}
.user-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.user-card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.user-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%}
.user-actions .btn{width:100%;justify-content:center}
.btn-role{background:rgba(96,165,250,0.08);color:var(--blue);border:1px solid rgba(96,165,250,0.22)}
.btn-role:hover{background:rgba(96,165,250,0.16)}
.btn-lock{background:rgba(244,63,94,0.1);color:#ff8ea1;border:1px solid rgba(244,63,94,0.25)}
.btn-lock:hover{background:rgba(244,63,94,0.2)}
.btn-unlock{background:rgba(16,217,160,0.12);color:var(--green);border:1px solid rgba(16,217,160,0.25)}
.btn-unlock:hover{background:rgba(16,217,160,0.22)}
.btn-muted{background:rgba(255,255,255,0.04);color:var(--muted2);border:1px solid var(--border2);cursor:not-allowed;opacity:0.75}
.btn-profile{background:rgba(251,191,36,0.1);color:var(--yellow);border:1px solid rgba(251,191,36,0.25)}
.btn-profile:hover{background:rgba(251,191,36,0.2)}

.profile-view-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.profile-view-avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:1px solid var(--border2);background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--cream2);flex-shrink:0}
.profile-view-avatar.clickable{cursor:pointer;transition:transform 0.16s ease, box-shadow 0.16s ease}
.profile-view-avatar.clickable:hover{transform:scale(1.04);box-shadow:0 8px 22px rgba(0,0,0,0.4)}
.profile-view-meta{display:flex;flex-wrap:wrap;gap:6px}
.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.profile-field{border:1px solid var(--border2);border-radius:10px;padding:10px;background:rgba(255,255,255,0.02)}
.profile-field.full{grid-column:1/-1}
.profile-field .k{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.profile-field .v{font-size:12px;color:var(--cream2);word-break:break-word;line-height:1.55}
.profile-field .v.empty{color:var(--muted)}

.image-preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);display:flex;align-items:center;justify-content:center;z-index:1201;padding:22px}
.image-preview-card{position:relative;max-width:min(680px,94vw);max-height:90vh;background:var(--bg3);border:1px solid var(--border2);border-radius:14px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,0.58)}
.image-preview-photo{display:block;max-width:min(640px,88vw);max-height:80vh;border-radius:12px;object-fit:contain;background:var(--card2)}
.image-preview-close{position:absolute;top:8px;right:8px;width:30px;height:30px;border:none;border-radius:999px;background:rgba(0,0,0,0.45);color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}

@media(max-width:560px){
  .profile-grid{grid-template-columns:1fr}
  .user-actions{grid-template-columns:1fr}
}

@media(max-width:500px){
  .user-actions{grid-template-columns:1fr}
}

@media(max-width:920px){
  body{
    overflow:auto;
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    min-width:0;
    flex-direction:row;
    align-items:flex-start;
    gap:0;
    overflow-x:auto;
    overflow-y:hidden;
  }

  .sidebar::after{
    display:none;
  }

  .sidebar-logo,
  .nav-group-label,
  .admin-card,
  .logout-btn span:not(:first-child){
    display:none;
  }

</style>
</head>
<body>

<div class="main">

    </div>

  <div class="content" id="content"></div>
</div>
<div class="toast-wrap" id="toast-wrap"></div>

<script>
function handleLogoError(img){
  const candidates = ["/static/Images/logo.png", "/logo.png", "static/Images/logo.png", "../static/Images/logo.png"];
  const current = img.getAttribute("src") || "";
  const idx = candidates.indexOf(current);
  const next = idx >= 0 ? candidates[idx + 1] : candidates[0];
  if (next) img.src = next;
}

const API   = window.location.origin;
const token = localStorage.getItem("access_token");
const uname = localStorage.getItem("username") || "Admin";
if (!token) location.href = "/auth_ui.html";
const savedRole = (localStorage.getItem("role") || "").trim().toLowerCase();
if (savedRole && savedRole !== "admin") location.href = "/chat_ui.html";

async function enforceAdminAccess() {
  if (!token) {
    location.href = "/auth_ui.html";
    return;
  }

  try {
    const meRes = await fetch(`${API}/auth/me`, {
      headers: { "Authorization": `Bearer ${token}` }
    });

    if (!meRes.ok) {
      localStorage.removeItem("access_token");
      localStorage.removeItem("role");
      location.href = "/auth_ui.html";
      return;
    }

    const me = await meRes.json();
    const role = (me.role || "").toString().trim().toLowerCase();
    localStorage.setItem("role", role || "user");
    if (role !== "admin") {
      location.href = "/chat_ui.html";
    }
  } catch {
    // Keep current view on transient errors; API calls will still enforce backend auth.
  }
}

enforceAdminAccess();
document.getElementById("admin-name").textContent = uname;
document.getElementById("admin-av").textContent   = uname.charAt(0).toUpperCase();
setInterval(()=>{ document.getElementById("clock").textContent = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); },1000);

let allFaqs=[], allUsers=[], allFailedQueries=[], currentPage=1, faqsPerPage=15;
let faqSearchQuery="", faqStatusFilter="all";
let userSearchQuery="", userRoleFilter="all";
let failedSearchQuery="", failedPriorityFilter="all";
let activeSection = "dashboard";
let mutationInProgress = false;
function H(){return{"Authorization":`Bearer ${token}`,"Content-Type":"application/json"}}

function setModalButtonsBusy(isBusy, busyText="Processing..."){
  const buttons = document.querySelectorAll("#modal-overlay .modal-footer .btn");
  buttons.forEach(button => {
    if (isBusy) {
      if (!button.dataset.originalText) {
        button.dataset.originalText = button.textContent || "";
      }
      button.disabled = true;
      if (!button.classList.contains("btn-ghost")) {
        button.textContent = busyText;
      }
    } else {
      button.disabled = false;
      if (button.dataset.originalText) {
        button.textContent = button.dataset.originalText;
      }
    }
  });
}

function canRunMutation(){
  if (mutationInProgress) {
    toast("Please wait for the current action to finish","info");
    return false;
  }
  mutationInProgress = true;
  setModalButtonsBusy(true);
  return true;
}

function finishMutation(){
  mutationInProgress = false;
  setModalButtonsBusy(false);
}

function escapeCsvCell(value){
  const text = String(value ?? "").replace(/"/g, '""');
  return `"${text}"`;
}

function downloadCsv(filename, rows){
  const csv = rows.map(row => row.map(escapeCsvCell).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function goto(page){
  activeSection = page;
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.remove("active"));
  const btn=document.getElementById("nav-"+page);
  if(btn) btn.classList.add("active");
  const titles={dashboard:"Dashboard",faqs:"Knowledge Base",announcements:"Announcements",failed:"Failed Queries",users:"Users",audit:"Audit Logs",help:"Help & Guide"};
  document.getElementById("page-title").textContent  = titles[page]||page;
  document.getElementById("breadcrumb").textContent  = "Home / "+(titles[page]||page);
  const fn={dashboard:loadDashboard,faqs:loadFAQs,announcements:loadAnnouncements,failed:loadFailed,users:loadUsers,audit:loadAudit,help:loadHelp};
  if(fn[page]) fn[page]();
}

function refreshCurrentSection(){
  const fn={dashboard:loadDashboard,faqs:loadFAQs,announcements:loadAnnouncements,failed:loadFailed,users:loadUsers,audit:loadAudit,help:loadHelp};
  if(fn[activeSection]) fn[activeSection]();
}

document.getElementById("refresh-page-btn")?.addEventListener("click", refreshCurrentSection);

function toast(msg,type="success"){
  const icons={success:"✅",error:"❌",info:"ℹ️",warn:"⚠️"};
  const t=document.createElement("div");
  t.className=`toast ${type}`;
  t.innerHTML=`<div class="toast-icon">${icons[type]||"ℹ️"}</div><div class="toast-msg">${msg}</div><button class="toast-close" onclick="this.parentElement.remove()">×</button>`;
  document.getElementById("toast-wrap").appendChild(t);
  setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.remove(),300);},3500);
}

function modal(html){
  const o=document.createElement("div");
  o.className="overlay";o.id="modal-overlay";
  o.innerHTML=`<div class="modal">${html}</div>`;
  o.addEventListener("click",e=>{if(e.target===o)closeModal();});
  document.body.appendChild(o);
  setTimeout(()=>o.querySelector("input,textarea")?.focus(),100);
}
function closeModal(){document.getElementById("modal-overlay")?.remove()}
function doLogout(){localStorage.clear();location.href="/auth_ui.html"}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function profileValue(value){
  const text = String(value ?? "").trim();
  return text ? escapeHtml(text) : '<span class="v empty">Not provided</span>';
}

function getUserById(userId){
  return allUsers.find(user => Number(user.id) === Number(userId)) || null;
}

function renderUserAvatarHtml(user, colorValue){
  const username = String(user?.username || "U");
  const profile = user?.profile || {};
  if (profile.photo_data) {
    return `<img class="user-avatar" src="${escapeHtml(profile.photo_data)}" alt="${escapeHtml(username)}" style="background:var(--card2)">`;
  }
  return `<div class="user-avatar" style="background:${colorValue}">${escapeHtml(username.charAt(0).toUpperCase())}</div>`;
}

function closeImagePreview(){
  document.getElementById("image-preview-overlay")?.remove();
}

function handleImagePreviewKeydown(event){
  if (event.key !== "Escape") return;
  if (!document.getElementById("image-preview-overlay")) return;
  closeImagePreview();
}

document.addEventListener("keydown", handleImagePreviewKeydown);

function openImagePreview(photoData, displayName = "User"){
  const photo = String(photoData || "").trim();
  if (!photo) {
    toast("No uploaded image available for this user","info");
    return;
  }

  closeImagePreview();
  const overlay = document.createElement("div");
  overlay.className = "image-preview-overlay";
  overlay.id = "image-preview-overlay";
  overlay.innerHTML = `
    <div class="image-preview-card">
      <button type="button" class="image-preview-close" aria-label="Close" onclick="closeImagePreview()">×</button>
      <img class="image-preview-photo" src="${escapeHtml(photo)}" alt="${escapeHtml(displayName)}">
    </div>
  `;
  overlay.addEventListener("click", event => {
    if (event.target === overlay) closeImagePreview();
  });
  document.body.appendChild(overlay);
}

function openUserProfile(userId){
  const user = getUserById(userId);
  if (!user) {
    toast("User details not found","error");
    return;
  }

  const profile = user.profile || {};
  const displayName = (profile.display_name || user.username || "User").trim();
  const initials = displayName.split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]?.toUpperCase()||"").join("") || "U";
  const avatar = profile.photo_data
    ? `<img class="profile-view-avatar clickable" src="${escapeHtml(profile.photo_data)}" alt="${escapeHtml(displayName)}" title="Click to view image" onclick="openImagePreview(${JSON.stringify(String(profile.photo_data || ""))}, ${JSON.stringify(displayName)})">`
    : `<div class="profile-view-avatar">${escapeHtml(initials)}</div>`;
  const roleBadge = user.role === "admin"
    ? '<span class="badge badge-orange">👑 Admin</span>'
    : '<span class="badge badge-blue">👤 Student</span>';
  const statusBadge = user.is_active
    ? '<span class="badge badge-green">✅ Active</span>'
    : '<span class="badge badge-red">⛔ Blocked</span>';

  modal(`<div class="modal-header"><h2>👤 User Profile</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="profile-view-top">
      ${avatar}
      <div>
        <div style="font-size:15px;font-weight:600">${escapeHtml(displayName)}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px">@${escapeHtml(user.username || "")}</div>
      </div>
    </div>
    <div class="profile-view-meta">${roleBadge}${statusBadge}</div>
    <div class="profile-grid" style="margin-top:12px">
      <div class="profile-field"><div class="k">Email</div><div class="v">${profileValue(profile.email || user.email)}</div></div>
      <div class="profile-field"><div class="k">Phone</div><div class="v">${profileValue(profile.phone)}</div></div>
      <div class="profile-field"><div class="k">Department</div><div class="v">${profileValue(profile.department)}</div></div>
      <div class="profile-field"><div class="k">Semester</div><div class="v">${profileValue(profile.semester)}</div></div>
      <div class="profile-field"><div class="k">Year</div><div class="v">${profileValue(profile.year)}</div></div>
      <div class="profile-field"><div class="k">Roll Number</div><div class="v">${profileValue(profile.roll_number)}</div></div>
      <div class="profile-field"><div class="k">Location</div><div class="v">${profileValue(profile.location)}</div></div>
      <div class="profile-field"><div class="k">LinkedIn</div><div class="v">${profileValue(profile.linkedin)}</div></div>
      <div class="profile-field full"><div class="k">Website</div><div class="v">${profileValue(profile.website)}</div></div>
      <div class="profile-field full"><div class="k">Bio</div><div class="v">${profileValue(profile.bio)}</div></div>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>`);
}

// ── DASHBOARD ──
async function loadDashboard(){
  document.getElementById("content").innerHTML=`<div class="empty"><div class="empty-icon">⏳</div><p>Loading dashboard...</p></div>`;
  try{
    const [dRes,fRes,uRes,aiRes]=await Promise.all([
      fetch(`${API}/admin/dashboard`,{headers:H()}),
      fetch(`${API}/admin/failed`,{headers:H()}),
      fetch(`${API}/admin/users`,{headers:H()}).catch(()=>({ok:false})),
      fetch(`${API}/admin/ai-status`,{headers:H()}).catch(()=>({ok:false}))
    ]);
    if(dRes.status===403){toast("Session expired","error");doLogout();return}
    const d=await dRes.json();
    const failed=fRes.ok?await fRes.json():[];
    const users=uRes.ok?await uRes.json():[];
    const ai = aiRes.ok ? await aiRes.json() : {enabled:false, model:"n/a", api_key_configured:false};
    const blockedUsers=users.filter(u=>!u.is_active).length;
    const highFreq=failed.filter(f=>f.frequency>=3).length;
    const sortedFailed = [...failed].sort((a,b)=>b.frequency-a.frequency);
    const topIssue = sortedFailed[0] || null;
    const aiReady = !!(ai.enabled && ai.api_key_configured);
    const aiState = aiReady ? "Ready" : (ai.enabled ? "Missing API Key" : "Disabled");
    const aiStateClass = aiReady ? "badge-green" : (ai.enabled ? "badge-yellow" : "badge-red");
    if(highFreq>0){document.getElementById("failed-badge").textContent=highFreq;document.getElementById("failed-badge").style.display="inline"}
    const coveragePct=d.total_faqs>0?Math.round((d.active_faqs/d.total_faqs)*100):0;
    
    // Quality metrics
    const feedbackTotal = d.feedback_total || 0;
    const feedbackPositive = d.feedback_positive || 0;
    const feedbackNegative = d.feedback_negative || 0;
    const fallbackRate = d.fallback_rate || 0;
    const feedbackPositivePct = feedbackTotal > 0 ? Math.round((feedbackPositive / feedbackTotal) * 100) : 0;
    const feedbackNegativePct = feedbackTotal > 0 ? Math.round((feedbackNegative / feedbackTotal) * 100) : 0;
    const topNegativeReasons = (d.top_negative_reasons || []).slice(0,3);

    document.getElementById("content").innerHTML=`
      <div class="stats-grid">
        <div class="stat-card c1" onclick="goto('faqs')">
          <div class="bar"></div>
          <div class="stat-top"><div class="stat-label">Total FAQs</div><div class="stat-icon">🧠</div></div>
          <div class="stat-value">${d.total_faqs??0}</div>
          <div class="stat-sub">${d.active_faqs??0} active · ${(d.total_faqs??0)-(d.active_faqs??0)} inactive</div>
        </div>
        <div class="stat-card c2" onclick="goto('users')">
          <div class="bar"></div>
          <div class="stat-top"><div class="stat-label">Blocked Users</div><div class="stat-icon">🔒</div></div>
          <div class="stat-value">${blockedUsers}</div>
          <div class="stat-sub">Require admin unblock</div>
        </div>
        <div class="stat-card c3" onclick="goto('users')">
          <div class="bar"></div>
          <div class="stat-top"><div class="stat-label">Total Users</div><div class="stat-icon">👥</div></div>
          <div class="stat-value">${users.length||'—'}</div>
          <div class="stat-sub">${users.filter(u=>u.role==='admin').length} admins · ${users.filter(u=>u.role==='user').length} students</div>
        </div>
        <div class="stat-card c4" onclick="goto('failed')">
          <div class="bar"></div>
          <div class="stat-top"><div class="stat-label">Failed Queries</div><div class="stat-icon">⚠️</div></div>
          <div class="stat-value">${d.failed_queries??0}</div>
          <div class="stat-sub">${highFreq} need urgent attention</div>
        </div>
      </div>
      <div class="dash-grid">
        <div class="panel">
          <div class="panel-title">📈 Chatbot Health</div>
          <div class="progress-row">
            <div class="progress-label">FAQ Coverage</div>
            <div class="progress-track"><div class="progress-fill" style="width:${coveragePct}%;background:linear-gradient(90deg,var(--saffron),var(--saf2))"></div></div>
            <div class="progress-value">${coveragePct}%</div>
          </div>
          <div class="progress-row">
            <div class="progress-label">Active FAQs</div>
            <div class="progress-track"><div class="progress-fill" style="width:${d.total_faqs?Math.round(d.active_faqs/d.total_faqs*100):0}%;background:linear-gradient(90deg,var(--green),var(--teal))"></div></div>
            <div class="progress-value">${d.active_faqs??0}</div>
          </div>
          <div style="margin-top:20px"><canvas id="convChart" height="140"></canvas></div>
        </div>
        <div class="panel">
          <div class="panel-title">👍👎 Feedback & Quality</div>
          <div class="status-lines">
            <div class="status-line"><span class="status-key">Total Feedback</span><span class="status-val">${feedbackTotal}</span></div>
            <div class="status-line"><span class="status-key">Positive</span><span style="color:var(--green);font-weight:600">${feedbackPositive} (${feedbackPositivePct}%)</span></div>
            <div class="status-line"><span class="status-key">Negative</span><span style="color:var(--red);font-weight:600">${feedbackNegative} (${feedbackNegativePct}%)</span></div>
          </div>
          <div style="margin-top:12px">
            <div class="progress-label">Satisfaction Rate</div>
            <div class="progress-track"><div class="progress-fill" style="width:${feedbackPositivePct}%;background:linear-gradient(90deg,var(--green),var(--teal))"></div></div>
            <div class="progress-value">${feedbackPositivePct}%</div>
          </div>
          ${topNegativeReasons.length > 0 ? `
          <div style="margin-top:14px">
            <div class="panel-title">⚠️ Top Issues from Feedback</div>
            <div style="display:flex;flex-direction:column;gap:6px">
              ${topNegativeReasons.map(r => `<div style="padding:6px 10px;background:rgba(244,63,94,0.1);border-left:3px solid var(--red);border-radius:4px;font-size:11px">${escapeHtml(r)}</div>`).join('')}
            </div>
          </div>
          ` : ''}
          <div style="margin-top:14px">
            <div class="progress-label">Fallback Rate</div>
            <div class="progress-track"><div class="progress-fill" style="width:${fallbackRate}%;background:linear-gradient(90deg,${fallbackRate > 30 ? 'var(--red)' : fallbackRate > 15 ? 'var(--yellow)' : 'var(--green)'},${fallbackRate > 30 ? '#fb7185' : fallbackRate > 15 ? '#fbbf24' : '#10d9a0'})"></div></div>
            <div class="progress-value">${fallbackRate.toFixed(1)}%</div>
            <div class="progress-sub">${fallbackRate > 30 ? '⚠️ High - increase FAQ coverage' : fallbackRate > 15 ? '⚠️ Moderate - add more FAQs' : '✓ Good - knowledge base is effective'}</div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-title">🤖 AI Layer Status</div>
          <div class="status-lines">
            <div class="status-line"><span class="status-key">State</span><span class="badge ${aiStateClass}">${aiState}</span></div>
            <div class="status-line"><span class="status-key">Enabled</span><span class="status-val">${ai.enabled ? 'true' : 'false'}</span></div>
            <div class="status-line"><span class="status-key">Model</span><span class="status-val">${ai.model || 'n/a'}</span></div>
            <div class="status-line"><span class="status-key">API Key</span><span class="status-val">${ai.api_key_configured ? 'configured' : 'missing'}</span></div>
          </div>
          <div style="height:14px"></div>
          <div class="panel-title">🚨 Operations Snapshot</div>
          <div class="status-lines">
            <div class="status-line"><span class="status-key">Top Repeated Failed Query</span><span class="status-val">${topIssue ? `${topIssue.frequency}x` : 'none'}</span></div>
            <div class="status-line"><span class="status-key">Issue Preview</span><span class="status-val" style="max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${topIssue ? topIssue.query_text : 'All good'}</span></div>

async function loadFAQs(){
  document.getElementById("content").innerHTML=`<div class="empty"><div class="empty-icon">⏳</div><p>Loading knowledge base...</p></div>`;
  try{
    const res=await fetch(`${API}/admin/faqs`,{headers:H()});
    allFaqs=await res.json();currentPage=1;renderFAQs();
  }catch(e){toast("Failed to load FAQs","error")}
}

function normalizeFaqSearchValue(value){
  return String(value || "").trim().toLowerCase();
}

function getFilteredFaqs(){
  const query = normalizeFaqSearchValue(faqSearchQuery);
  const filtered = allFaqs.filter(item => {
    const idText = String(item.id || "").toLowerCase();
    const keywordText = String(item.keyword || "").toLowerCase();
    const responseText = String(item.response || "").toLowerCase();
    const statusText = item.is_active ? "active" : "inactive";
    const matchesQuery = !query || [idText, keywordText, responseText, statusText].some(text => text.includes(query));
    const matchesStatus = faqStatusFilter === "all" || (faqStatusFilter === "active" ? item.is_active : !item.is_active);
    return matchesQuery && matchesStatus;
  });
  return filtered;
}

function renderFAQs(){
  const faqs = getFilteredFaqs();
  const total=faqs.length,pages=Math.ceil(total/faqsPerPage);
  const start=(currentPage-1)*faqsPerPage,paged=faqs.slice(start,start+faqsPerPage);
  let rows=paged.map(f=>{
    const kw=f.keyword.split(",").map(k=>`<span class="chip">${k.trim()}</span>`).join("");
    return `<tr>
      <td style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)">#${f.id}</td>
      <td><div class="chips">${kw}</div></td>
      <td><span class="truncate" title="${f.response.replace(/"/g,'&quot;')}">${f.response}</span></td>
      <td><span class="badge ${f.is_active?'badge-green':'badge-red'}">${f.is_active?'Active':'Inactive'}</span></td>
      <td><div class="action-group">
        <button class="btn btn-ghost btn-sm" onclick='editFAQ(${f.id},${JSON.stringify(f.keyword)},${JSON.stringify(f.response)})'>✏️ Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteFAQ(${f.id})">🗑️</button>
      </div></td>
    </tr>`;
  }).join("");
  let pagerBtns="";
  for(let i=1;i<=pages;i++) pagerBtns+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="changePage(${i})">${i}</button>`;

  document.getElementById("content").innerHTML=`
    <div class="section-hdr">
      <h2>🧠 Knowledge Base <span class="count">${total} total</span></h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-blue" onclick="exportFaqsCsv()">⬇️ Export CSV</button>
        <button class="btn btn-primary" onclick="openAddFAQ()">➕ Add FAQ</button>
      </div>
    </div>
    <div class="info-box"><span class="info-icon">💡</span><span>The chatbot matches student questions to <strong>keywords</strong> below and replies with the saved response. More keywords = better accuracy. Separate keywords with commas.</span></div>
    <div class="toolbar">
      <div class="search-wrap"><span style="color:var(--muted)">🔍</span><input type="text" placeholder="Search by ID, keyword, response, or status…" value="${faqSearchQuery.replace(/"/g,'&quot;')}" oninput="filterFAQs(this.value)" id="faq-search"></div>
      <select class="filter-select" onchange="filterStatus(this.value)" id="filter-status">
        <option value="all" ${faqStatusFilter==='all'?'selected':''}>All Status</option><option value="active" ${faqStatusFilter==='active'?'selected':''}>Active only</option><option value="inactive" ${faqStatusFilter==='inactive'?'selected':''}>Inactive only</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Keywords</th><th>Response</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="5"><div class="empty"><div class="empty-icon">📭</div><h3>No FAQs</h3><p>No results found.</p></div></td></tr>'}</tbody>
      </table>

    </div>`;
}

  return getFilteredFaqs();
}

// ── FAILED QUERIES ──
async function loadFailed(){
  document.getElementById("content").innerHTML=`<div class="empty"><div class="empty-icon">⏳</div><p>Loading...</p></div>`;
  try{
    const res=await fetch(`${API}/admin/failed`,{headers:H()});
    const data=await res.json();
    allFailedQueries = [...data].sort((a,b)=>b.frequency-a.frequency);
    if(allFailedQueries.length===0){
      document.getElementById("content").innerHTML=`<div class="empty" style="padding:80px 20px"><div class="empty-icon">🎉</div><h3>All Clear!</h3><p>The chatbot is answering every question. No failed queries found.</p></div>`;
      return;
    }
    renderFailedQueries();
  }catch(e){toast("Failed to load","error")}
}

function getPriorityLabel(frequency){
  if (frequency >= 5) return "high";
  if (frequency >= 2) return "medium";
  return "low";
}

function getFilteredFailedQueries(){
  const query = failedSearchQuery.trim().toLowerCase();
  return allFailedQueries.filter(item => {
    const matchQuery = !query || String(item.query_text || "").toLowerCase().includes(query);
    const priority = getPriorityLabel(Number(item.frequency || 0));
    const matchPriority = failedPriorityFilter === "all" || priority === failedPriorityFilter;
    return matchQuery && matchPriority;
  });
}

function renderFailedQueries(){
  const filtered = getFilteredFailedQueries();
  const urgent = filtered.filter(f=>Number(f.frequency || 0)>=5);

  let rows=filtered.map(f=>{
    const cls=f.frequency>=5?"badge-red":f.frequency>=2?"badge-yellow":"badge-green";
    const lbl=f.frequency>=5?"🔴 High":f.frequency>=2?"🟡 Medium":"🟢 Low";
    const safe=f.query_text.replace(/'/g,"\\'").replace(/"/g,"&quot;");
    return `<tr>
      <td style="max-width:300px">${f.query_text}</td>
      <td><span class="badge ${cls}">${f.frequency}×</span></td>
      <td>${lbl}</td>
      <td style="color:var(--muted);font-size:11px;white-space:nowrap;font-family:'JetBrains Mono',monospace">${f.created_at?new Date(f.created_at).toLocaleDateString():'-'}</td>
      <td style="display:flex;gap:6px"><button class="btn btn-success btn-sm" onclick="convertToFAQ('${safe}')">➕ Add as FAQ</button><button class="btn btn-danger btn-sm" onclick="deleteFailedQuery(${f.id},'${safe}')">🗑️ Delete</button></td>
    </tr>`;
  }).join("");

  document.getElementById("content").innerHTML=`
    <div class="section-hdr"><h2>⚠️ Failed Queries <span class="count">${allFailedQueries.length} unique</span></h2>
      <button class="btn btn-blue" onclick="exportFailedQueriesCsv()">⬇️ Export CSV</button>
    </div>
    ${urgent.length>0?`<div class="warn-box"><span class="info-icon">🔴</span><span><strong>${urgent.length} high-priority queries</strong> in current view asked 5+ times with no answer. Add them as FAQs to improve chatbot quality quickly.</span></div>`:''}
    <div class="info-box"><span class="info-icon">💡</span><span>Use search + priority filters to triage first, then convert top repeated questions into FAQs.</span></div>
    <div class="toolbar">
      <div class="search-wrap"><span style="color:var(--muted)">🔍</span><input type="text" placeholder="Search failed query text..." value="${failedSearchQuery.replace(/"/g,'&quot;')}" oninput="filterFailedQueryText(this.value)"></div>
      <select class="filter-select" onchange="filterFailedPriority(this.value)">
        <option value="all" ${failedPriorityFilter==='all'?'selected':''}>All Priorities</option>
        <option value="high" ${failedPriorityFilter==='high'?'selected':''}>High (5x+)</option>
        <option value="medium" ${failedPriorityFilter==='medium'?'selected':''}>Medium (2x-4x)</option>
        <option value="low" ${failedPriorityFilter==='low'?'selected':''}>Low (1x)</option>
      </select>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Student's Question</th><th>Asked</th><th>Priority</th><th>First Seen</th><th>Fix It</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5"><div class="empty"><div class="empty-icon">📭</div><h3>No Matching Failed Queries</h3><p>Try a different keyword or priority filter.</p></div></td></tr>'}</tbody>
    </table></div>`;
}

function filterFailedQueryText(value){
  failedSearchQuery = value || "";
  renderFailedQueries();
}

function filterFailedPriority(value){
  failedPriorityFilter = value || "all";
  renderFailedQueries();
}

function exportFailedQueriesCsv(){
  const rows = getFilteredFailedQueries();
  if (!rows.length) {
    toast("No failed queries to export","info");
    return;
  }

  const csvRows = [
    ["id", "query_text", "frequency", "priority", "created_at"],
    ...rows.map(item => [
      item.id,
      item.query_text,
      item.frequency,
      getPriorityLabel(Number(item.frequency || 0)),
      item.created_at || ""
    ])
  ];

  downloadCsv(`failed-queries-${Date.now()}.csv`, csvRows);
  toast("Failed queries exported","success");
}

function convertToFAQ(queryText){
  modal(`<div class="modal-header"><h2>➕ Add to Knowledge Base</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="info-box"><span class="info-icon">💡</span><span>Edit the keywords to add more variations, then write the answer the chatbot should give.</span></div>
    <div class="field"><label>Keywords</label><input type="text" id="m-kw" value="${queryText.replace(/"/g,'&quot;')}"><div class="hint">Add more keywords separated by commas</div></div>
    <div class="field"><label>Chatbot Response *</label><textarea id="m-res" placeholder="Write the answer the chatbot should give…"></textarea></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitAddFAQ()">➕ Add to Knowledge Base</button></div>`);
}

// ── USERS ──

function deleteFailedQuery(queryId, queryText){
  modal(`<div class="modal-header"><h2>🗑️ Delete Failed Query</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="warn-box"><span class="info-icon">⚠️</span><span>This failed query record will be deleted from the system. You can still view the chatbot's history, but this query will no longer appear in the failed queries list.</span></div>
    <div style="background:var(--card);padding:12px;border-radius:8px;margin:12px 0;border-left:3px solid var(--muted)"><strong>Query:</strong> "${queryText}"</div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="confirmDeleteFailedQuery(${queryId})">Yes, Delete</button></div>`);
}

async function confirmDeleteFailedQuery(queryId){
  if (!canRunMutation()) return;
  try{
    const res=await fetch(`${API}/admin/failed/${queryId}`,{method:"DELETE",headers:H()});
    if(!res.ok) throw new Error("Failed to delete");
    closeModal();
    toast("Failed query deleted ✓","success");
    loadFailed();
  }catch(e){toast("Delete failed: "+e.message,"error")}
  finally{finishMutation()}
}

async function loadUsers(){
  document.getElementById("content").innerHTML=`<div class="empty"><div class="empty-icon">⏳</div><p>Loading users...</p></div>`;
  try{
    const res=await fetch(`${API}/admin/users`,{headers:H()});
    if(res.status===404){document.getElementById("content").innerHTML=`<div class="empty"><div class="empty-icon">🚧</div><h3>Endpoint Not Found</h3><p>Add <code style="background:var(--card2);padding:2px 6px;border-radius:4px">GET /admin/users</code> to app.py</p></div>`;return}
    allUsers=await res.json();renderUsers(allUsers);
  }catch(e){toast("Failed to load users","error")}
}


function renderUsers(users){
  const colors=["#f0900d","#14b8a6","#60a5fa","#f43f5e","#a78bfa","#fbbf24"];
  const admins=users.filter(u=>u.role==="admin");
  const blocked=users.filter(u=>!u.is_active);
  const mainAdmin=admins.slice().sort((a,b)=>a.id-b.id)[0]||null;
  const currentAdmin=admins.find(u=>u.username===uname)||null;
  const isCurrentMainAdmin=Boolean(mainAdmin&&currentAdmin&&mainAdmin.id===currentAdmin.id);
  const viewerChipClass=isCurrentMainAdmin?"viewer-role-chip main":"viewer-role-chip";
  const viewerChipText=isCurrentMainAdmin?"⭐ Main Admin Session":"👑 Admin Session";
  let cards=users.map((u,i)=>{
    const col=colors[i%colors.length];
    const safeName=String(u.username).replace(/'/g,"\\'");
    const isSelfAdmin=Boolean(currentAdmin&&u.id===currentAdmin.id);
    const isMainAdminAccount=Boolean(mainAdmin&&u.id===mainAdmin.id);
    const lockedAdminControls=u.role==="admin"&&!isCurrentMainAdmin&&!isSelfAdmin;
    const mainMarker=isMainAdminAccount?`<span class="name-badge-main">MAIN</span>`:"";
    const rb=u.role==="admin"?`<span class="badge badge-orange">👑 Admin</span>`:`<span class="badge badge-blue">👤 Student</span>`;
    const pb=lockedAdminControls?`<span class="badge badge-yellow">🔒 Protected</span>`:"";
    const sb=u.is_active
      ? `<span class="badge badge-green">✅ Active</span>`
      : `<span class="badge badge-red">⛔ Blocked</span>`;
    const blockBtn=lockedAdminControls
      ? `<button class="btn btn-sm btn-muted" disabled title="Only main admin can block admin accounts">Block Locked</button>`
      : (u.is_active
        ? `<button class="btn btn-sm btn-lock" onclick="toggleBlock(${u.id},true,'${safeName}')">Block</button>`
        : `<button class="btn btn-sm btn-unlock" onclick="toggleBlock(${u.id},false,'${safeName}')">Unblock</button>`);
    const roleBtn=lockedAdminControls
      ? `<button class="btn btn-sm btn-muted" disabled title="Only main admin can change other admin roles">Role Locked</button>`
      : `<button class="btn btn-sm btn-role" onclick="toggleRole(${u.id},'${u.role}','${safeName}')">Change Role</button>`;
    return `<div class="user-card">
      <div class="user-card-top clickable" onclick="openUserProfile(${u.id})" title="View full profile">
        ${renderUserAvatarHtml(u, col)}
        <div><div class="user-name-line"><div class="user-card-name">${u.username}</div>${mainMarker}</div><div class="user-card-email" title="${u.email}">${u.email}</div></div>
      </div>
      <div class="user-meta">${rb}${pb}${sb}</div>
      <div class="user-card-footer">
        <div class="user-actions"><button class="btn btn-sm btn-profile" onclick="openUserProfile(${u.id})">Profile</button>${roleBtn}${blockBtn}</div>
      </div>
    </div>`;
  }).join("");

  document.getElementById("content").innerHTML=`
    <div class="section-hdr">
      <h2>👥 Users <span class="count">${users.length} total</span></h2>
      <span class="${viewerChipClass}">${viewerChipText}</span>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      <div class="stat-card c1" style="flex:1;min-width:120px;padding:14px"><div class="bar"></div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">Admins</div><div style="font-size:28px;font-weight:700;margin-top:4px">${admins.length}</div></div>
      <div class="stat-card c3" style="flex:1;min-width:120px;padding:14px"><div class="bar"></div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">Students</div><div style="font-size:28px;font-weight:700;margin-top:4px">${users.length-admins.length}</div></div>
      <div class="stat-card c2" style="flex:1;min-width:120px;padding:14px"><div class="bar"></div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">Total</div><div style="font-size:28px;font-weight:700;margin-top:4px">${users.length}</div></div>
      <div class="stat-card" style="flex:1;min-width:120px;padding:14px"><div class="bar"></div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">Blocked</div><div style="font-size:28px;font-weight:700;margin-top:4px;color:var(--red)">${blocked.length}</div></div>
    </div>
    <div class="toolbar">
      <div class="search-wrap"><span style="color:var(--muted)">🔍</span><input type="text" placeholder="Search by name or email…" oninput="filterUsers(this.value)"></div>
      <select class="filter-select" onchange="filterUserRole(this.value)">
        <option value="all">All Users</option>
        <option value="admin">Admins only</option>
        <option value="user">Students only</option>
        <option value="blocked">Blocked only</option>
        <option value="protected-admin">Protected admins only</option>
      </select>
    </div>
    <div class="users-grid" id="users-grid">${cards}</div>`;
}

function filterUsers(q){
  userSearchQuery=q||"";
  applyUserFilters();
}
function filterUserRole(r){
  userRoleFilter=r||"all";
  applyUserFilters();
}

function applyUserFilters(){
  const q=userSearchQuery.toLowerCase();
  const admins=allUsers.filter(u=>u.role==="admin");
  const mainAdmin=admins.slice().sort((a,b)=>a.id-b.id)[0]||null;
  const currentAdmin=admins.find(u=>u.username===uname)||null;
  const isCurrentMainAdmin=Boolean(mainAdmin&&currentAdmin&&mainAdmin.id===currentAdmin.id);
  let filtered=allUsers.filter(u=>
    u.username.toLowerCase().includes(q)||u.email.toLowerCase().includes(q)
  );

  if(userRoleFilter==="admin") filtered=filtered.filter(u=>u.role==="admin");
  if(userRoleFilter==="user") filtered=filtered.filter(u=>u.role==="user");
  if(userRoleFilter==="blocked") filtered=filtered.filter(u=>!u.is_active);
  if(userRoleFilter==="protected-admin") {
    filtered=filtered.filter(u=>u.role==="admin"&&!isCurrentMainAdmin&&(!currentAdmin||u.id!==currentAdmin.id));
  }

  redrawUserCards(filtered);
}
function redrawUserCards(users){
  const colors=["#f0900d","#14b8a6","#60a5fa","#f43f5e","#a78bfa","#fbbf24"];
  const admins=allUsers.filter(u=>u.role==="admin");
  const mainAdmin=admins.slice().sort((a,b)=>a.id-b.id)[0]||null;
  const currentAdmin=admins.find(u=>u.username===uname)||null;
  const isCurrentMainAdmin=Boolean(mainAdmin&&currentAdmin&&mainAdmin.id===currentAdmin.id);
  document.getElementById("users-grid").innerHTML=users.map((u,i)=>{
    const col=colors[i%colors.length];
    const safeName=String(u.username).replace(/'/g,"\\'");
    const isSelfAdmin=Boolean(currentAdmin&&u.id===currentAdmin.id);
    const isMainAdminAccount=Boolean(mainAdmin&&u.id===mainAdmin.id);
    const lockedAdminControls=u.role==="admin"&&!isCurrentMainAdmin&&!isSelfAdmin;
    const mainMarker=isMainAdminAccount?`<span class="name-badge-main">MAIN</span>`:"";
    const rb=u.role==="admin"?`<span class="badge badge-orange">👑 Admin</span>`:`<span class="badge badge-blue">👤 Student</span>`;
    const pb=lockedAdminControls?`<span class="badge badge-yellow">🔒 Protected</span>`:"";
    const sb=u.is_active
      ? `<span class="badge badge-green">✅ Active</span>`
      : `<span class="badge badge-red">⛔ Blocked</span>`;
    const blockBtn=lockedAdminControls
      ? `<button class="btn btn-sm btn-muted" disabled title="Only main admin can block admin accounts">Block Locked</button>`
      : (u.is_active
        ? `<button class="btn btn-sm btn-lock" onclick="toggleBlock(${u.id},true,'${safeName}')">Block</button>`
        : `<button class="btn btn-sm btn-unlock" onclick="toggleBlock(${u.id},false,'${safeName}')">Unblock</button>`);
    const roleBtn=lockedAdminControls
      ? `<button class="btn btn-sm btn-muted" disabled title="Only main admin can change other admin roles">Role Locked</button>`
      : `<button class="btn btn-sm btn-role" onclick="toggleRole(${u.id},'${u.role}','${safeName}')">Change Role</button>`;
    return `<div class="user-card"><div class="user-card-top clickable" onclick="openUserProfile(${u.id})" title="View full profile">${renderUserAvatarHtml(u, col)}<div><div class="user-name-line"><div class="user-card-name">${u.username}</div>${mainMarker}</div><div class="user-card-email">${u.email}</div></div></div><div class="user-meta">${rb}${pb}${sb}</div><div class="user-card-footer"><div class="user-actions"><button class="btn btn-sm btn-profile" onclick="openUserProfile(${u.id})">Profile</button>${roleBtn}${blockBtn}</div></div></div>`;
  }).join("");
}

function toggleRole(id,currentRole,name){
  const newRole=currentRole==="admin"?"user":"admin";
  modal(`<div class="modal-header"><h2>🔄 Change Role</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:40px;margin-bottom:12px">${newRole==="admin"?"👑":"👤"}</div>
      <p style="font-size:14px;line-height:1.7;color:var(--cream2)">Change <strong style="color:var(--saffron)">${name}</strong>'s role to <strong>${newRole==="admin"?"👑 Admin":"👤 Student"}</strong>?</p>
      ${newRole==="admin"?`<p style="font-size:12px;color:var(--yellow);margin-top:10px">⚠️ This gives full admin access to this panel.</p>`:`<p style="font-size:12px;color:var(--muted);margin-top:10px">They will lose admin access and become a regular student.</p>`}
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="confirmToggleRole(${id},'${newRole}')">Confirm Change</button></div>`);
}

async function confirmToggleRole(id,newRole){
  if (!canRunMutation()) return;
  try{
    const r=await fetch(`${API}/admin/users/${id}/role`,{method:"PATCH",headers:H(),body:JSON.stringify({role:newRole})});
    closeModal();
    if(r.ok){toast(`Role updated to ${newRole} ✓`);loadUsers();return;}
    const data=await r.json().catch(()=>({}));
    toast(data.detail||"Failed to update role","error");
  }catch(e){toast("Error","error")}
  finally{finishMutation()}
}

function toggleBlock(id,isCurrentlyActive,name){
  const action=isCurrentlyActive?"Block":"Unblock";
  const icon=isCurrentlyActive?"🔒":"✅";
  const note=isCurrentlyActive
    ? "Blocked users cannot log in until you unblock them."
    : "This user will be able to log in again.";

  modal(`<div class="modal-header"><h2>${icon} ${action} User</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:40px;margin-bottom:12px">${icon}</div>
      <p style="font-size:14px;line-height:1.7;color:var(--cream2)">${action} <strong style="color:var(--saffron)">${name}</strong>?</p>
      <p style="font-size:12px;color:var(--muted);margin-top:10px">${note}</p>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn ${isCurrentlyActive?"btn-danger":"btn-primary"}" onclick="confirmToggleBlock(${id},${!isCurrentlyActive})">${action}</button></div>`);
}

async function confirmToggleBlock(id,isActive){
  if (!canRunMutation()) return;
  try{
    const r=await fetch(`${API}/admin/users/${id}/status`,{method:"PATCH",headers:H(),body:JSON.stringify({is_active:isActive})});
    closeModal();
    if(r.ok){
      toast(`User ${isActive?"unblocked":"blocked"} ✓`);
      loadUsers();
      return;
    }
    const data=await r.json().catch(()=>({}));
    toast(data.detail||"Failed to update status","error");
  }catch(e){toast("Error updating user status","error")}
  finally{finishMutation()}
}

// ── AUDIT LOGS ──
async function loadAudit(){
  document.getElementById("content").innerHTML=`<div class="empty"><div class="empty-icon">⏳</div><p>Loading audit logs...</p></div>`;
  try{
    const res=await fetch(`${API}/admin/audit`,{headers:H()});
    const logs=await res.json();
    let rows=logs.map(l=>{
      const a=l.action||"";
      const icon=a.includes("Added")?"➕":a.includes("Deleted")?"🗑️":a.includes("Changed")?"🔄":"📝";
      const cls=a.includes("Deleted")?"badge-red":a.includes("Added")?"badge-green":a.includes("Changed")?"badge-yellow":"badge-blue";
      const type=a.includes("Added")?"Create":a.includes("Deleted")?"Delete":a.includes("Changed")?"Update":"Action";
      return `<tr>
        <td style="width:36px;font-size:16px;text-align:center">${icon}</td>
        <td><span style="font-weight:500">${l.user_email}</span></td>
        <td>${l.action}</td>
        <td><span class="badge ${cls}">${type}</span></td>
        <td style="font-size:11px;color:var(--muted);white-space:nowrap;font-family:'JetBrains Mono',monospace">${new Date(l.timestamp).toLocaleString('en-IN')}</td>
      </tr>`;
    }).join("");

    document.getElementById("content").innerHTML=`
      <div class="section-hdr"><h2>📋 Audit Logs <span class="count">Last 50 actions</span></h2></div>
      <div class="info-box"><span class="info-icon">🔒</span><span>Every admin action is logged here for security and accountability. Helps track who changed what and when.</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th></th><th>Admin</th><th>Action</th><th>Type</th><th>Date & Time</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="5"><div class="empty"><div class="empty-icon">📋</div><h3>No Logs Yet</h3><p>Admin actions will appear here.</p></div></td></tr>'}</tbody>
      </table></div>`;
  }catch(e){toast("Failed to load logs","error")}
}
