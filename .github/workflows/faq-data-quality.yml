name: FAQ Data Quality

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  validate-faq-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run FAQ data quality tests
        run: python -m unittest discover -s tests -p "test_faq_data_quality.py" -q
